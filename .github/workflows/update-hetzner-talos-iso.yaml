name: Update Hetzner Talos ISO

on:
  workflow_dispatch:
    inputs:
      cask_api_probe:
        description: Read-only probe of existing App access for cask handoff
        required: false
        type: boolean
        default: false
  schedule:
    # Poll away from the top of the hour, where GitHub warns scheduled runs
    # can be delayed or dropped under high load.
    - cron: "23 */6 * * *"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: inputs.cask_api_probe != true
    name: Track public ISO compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step that needs write access uses the GitHub App token generated below
    # (checkout, and the pull-request action), so GITHUB_TOKEN itself needs no write
    # scope. Read-only keeps the ambient token from being a second, broader path to
    # the same operations.
    permissions:
      contents: read
    steps:
      - name: 🔑 Generate GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - GitHub App token generation has no environment scoping
          permission-contents: write
          permission-pull-requests: write

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ♻️ Restore Go modules
        uses: devantler-tech/ksail/.github/actions/restore-go-modules@46fdd72dff3ccc24a494508fde43426c7e65a0e3

      - name: 🔎 Read official Hetzner catalog
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/maintenance/hetznertalos/cmd

          if git diff --quiet -- \
            pkg/apis/cluster/v1alpha1/defaults.go \
            pkg/apis/cluster/v1alpha1/options.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Verify compatibility update
        if: steps.catalog.outputs.changed == 'true'
        run: >-
          go test
          ./internal/maintenance/hetznertalos
          ./pkg/apis/cluster/v1alpha1
          ./pkg/fsutil/configmanager/talos
          ./pkg/fsutil/configmanager/ksail

      - name: 📤 Open compatibility update PR
        if: steps.catalog.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Commits through the GitHub API rather than the git CLI, because the
          # repository requires signed commits (ruleset "Require signed commits")
          # and API-created commits are signed by GitHub automatically. A CLI commit
          # here is unsigned and makes the pull request permanently unmergeable, so
          # the automated update could never land. See .github/workflows/ci.yaml.
          sign-commits: true
          token: ${{ steps.generate-token.outputs.token }}
          branch-token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore(talos): update Hetzner ISO compatibility pair"
          committer: "ksail-bot <ksail-bot@users.noreply.github.com>"
          branch: chore/update-hetzner-talos-iso
          base: ${{ github.event.repository.default_branch }}
          title: "chore(talos): update Hetzner ISO compatibility pair"
          body: |
            Hetzner announced a newer public Talos Linux ISO in its official changelog.

            This automated update keeps the following defaults on one reviewed head:
            - Hetzner x86 ISO ID
            - Talos bootstrap compatibility version
            - Kubernetes default inherited from the pinned Talos machinery dependency

            KSail's existing CI generator appends any derived schema and documentation
            changes to this same PR before it can pass required checks.

            Source: https://docs.hetzner.cloud/changelog/feed.rss
          delete-branch: true

  cask-api-probe:
    name: Read-only existing App handoff access
    if: github.event_name == 'workflow_dispatch' && inputs.cask_api_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate narrowly scoped existing App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - Existing App token generation has no environment scoping
          owner: ${{ github.repository_owner }}
          repositories: |
            ksail
            homebrew-tap
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
      - name: Read actual handoff evidence surfaces without mutations
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          # Match the production handoff reader, including required-check and
          # workflow identity fields. This tests access, never merge readiness.
          query='query CaskAccess {
            repository(owner:"devantler-tech",name:"homebrew-tap") {
              pullRequest(number:2246) {
                id state isDraft headRefOid mergeable mergeStateStatus
                reviewThreads(first:1) { nodes { isResolved } }
                commits(last:1) { nodes { commit {
                  oid statusCheckRollup { contexts(first:100) {
                    nodes { __typename
                      ... on CheckRun { name status conclusion isRequired(pullRequestNumber:2246)
                        checkSuite { app { id slug } commit { oid }
                          workflowRun { id runNumber event workflow { id } } } }
                      ... on StatusContext { context state isRequired(pullRequestNumber:2246) }
                    } pageInfo { hasNextPage }
                  } }
                } } }
              }
            }
            rateLimit { remaining resetAt }
          }'
          if ! gh api graphql -f "query=$query" > "$work/access.json" 2> "$work/error"; then
            echo '::error::Existing App cannot read the complete required handoff surface.'
            exit 1
          fi
          jq -e '
            (.errors == null or .errors == []) and
            (.data.repository.pullRequest as $pr |
              ($pr.id | type == "string") and
              ($pr.commits.nodes | length == 1) and
              ($pr.commits.nodes[0].commit.oid == $pr.headRefOid) and
              ($pr.commits.nodes[0].commit.statusCheckRollup.contexts as $checks |
                $checks.pageInfo.hasNextPage == false and
                ($checks.nodes | length > 0) and
                all($checks.nodes[]; (.isRequired | type == "boolean"))))
          ' "$work/access.json" >/dev/null
          gh api repos/devantler-tech/ksail/releases/tags/v7.206.27 --jq '.assets | length > 0' > "$work/source-read"
          [[ "$(<"$work/source-read")" == true ]]
          echo 'Existing App reads the real cross-repository handoff and source-release evidence.'
