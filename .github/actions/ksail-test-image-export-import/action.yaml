name: KSail Image Export/Import Test
description: |
  Tests the container image export/import round-trip on a running cluster:
    1. Deploy a test workload with a known image
    2. Export specific image to a tar archive
    3. Verify the archive was created and is non-empty
    4. Import the archive back into the cluster
    5. Verify the workload still runs (round-trip integrity)
    6. Export every image on the nodes, so an import that stored a
       reference to nothing fails here, and check that the import added no
       generated import-<date> alias for a named image
    7. On an explicitly named two-node Kind cluster only, give each node an
       image no other node holds, and prove a selected and a full export
       each restore both on every node (#8251)

  Only supported for Vanilla (Kind) and K3s (K3d) distributions.
  Talos and VCluster are unsupported (immutable OS / nested containerd).

  Does NOT create or delete the cluster — the orchestrator handles that.

inputs:
  split-image-cluster-name:
    description: |
      Name of the two-node Kind cluster for the split-image export check.
      Empty (the default) skips the check; only the CI fixture cluster is accepted.
    required: false
    default: ""
  test-workload-name:
    description: Name for the test workload deployment
    required: false
    default: "export-import-test"
  test-workload-image:
    description: Image to use for the test workload
    required: false
    default: "traefik/whoami:v1.10"
  workload-timeout:
    description: |
      Timeout for workload wait operations. Set to 10 minutes to handle
      intermittent delays in CI environments (image pulls, resource contention).
    required: false
    default: "600s"

runs:
  using: composite
  steps:
    - name: 🧪 Deploy export/import test workload
      id: deploy
      shell: bash
      env:
        WORKLOAD_NAME: ${{ inputs.test-workload-name }}
        WORKLOAD_IMAGE: ${{ inputs.test-workload-image }}
        TIMEOUT: ${{ inputs.workload-timeout }}
      run: |
        create_succeeded=false
        for attempt in 1 2 3; do
          if ksail workload create deployment "$WORKLOAD_NAME" --image="$WORKLOAD_IMAGE"; then
            create_succeeded=true
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "⚠️ workload create attempt $attempt failed, retrying in 10s…"
            sleep 10
          fi
        done
        if [ "$create_succeeded" != "true" ]; then
          echo "❌ ksail workload create failed after 3 attempts for deployment/$WORKLOAD_NAME"
          exit 1
        fi
        ksail workload wait --for=condition=Available deployment/"$WORKLOAD_NAME" --timeout="$TIMEOUT"

    - name: 🧪 ksail workload export
      id: export
      shell: bash
      env:
        WORKLOAD_IMAGE: ${{ inputs.test-workload-image }}
      run: |
        export_image="$WORKLOAD_IMAGE"
        first_component="${WORKLOAD_IMAGE%%/*}"

        # Normalize shorthand image references to the fully-qualified names
        # containerd typically stores internally.
        if [[ "$WORKLOAD_IMAGE" != */* ]]; then
          export_image="docker.io/library/$WORKLOAD_IMAGE"
        elif [[ "$first_component" != *.* && "$first_component" != *:* && "$first_component" != "localhost" ]]; then
          export_image="docker.io/$WORKLOAD_IMAGE"
        fi

        ksail workload export /tmp/test-images.tar --image="$export_image"
        # Verify the archive was created and is non-empty
        test -s /tmp/test-images.tar
        echo "✅ Image export succeeded ($(du -h /tmp/test-images.tar | cut -f1)) from $export_image"

    - name: 🧪 Record node image names before import
      id: names-before-import
      shell: bash
      run: |
        # Node images can already carry import-<date> aliases (a Kind node
        # image is built by importing its bundled images), so the alias check
        # after the import compares against this list and judges only the
        # names the import added (#8158).
        ksail workload export /tmp/test-images-before-import.tar
        { tar -xOf /tmp/test-images-before-import.tar index.json 2>/dev/null ||
          tar -xOf /tmp/test-images-before-import.tar ./index.json; } |
          jq -r '.manifests[].annotations
            | (.["io.containerd.image.name"] // .["org.opencontainers.image.ref.name"] // empty)' |
          sort -u >/tmp/test-image-names-before-import.txt
        test -s /tmp/test-image-names-before-import.txt
        echo "✅ Recorded $(wc -l </tmp/test-image-names-before-import.txt) image names before the import"
        rm -f /tmp/test-images-before-import.tar

    - name: 🧪 ksail workload import
      id: import
      shell: bash
      env:
        WORKLOAD_NAME: ${{ inputs.test-workload-name }}
        TIMEOUT: ${{ inputs.workload-timeout }}
      run: |
        # Import the previously exported images back
        ksail workload import /tmp/test-images.tar
        echo "✅ Image import succeeded"
        # Restart pods to force an image lookup from containerd, validating
        # that the imported images are actually usable on the node.
        ksail workload rollout restart deployment/"$WORKLOAD_NAME"
        ksail workload wait --for=condition=Available deployment/"$WORKLOAD_NAME" --timeout="$TIMEOUT"
        echo "✅ Import round-trip validated (pods restarted and healthy)"

    - name: 🧪 ksail workload export after import
      id: export-after-import
      shell: bash
      run: |
        # Export every image on the nodes, the import included. An import must
        # store only the images the archive names: an entry for the archive's
        # own top-level index names no real image, so this export would fail
        # on it (#8158).
        ksail workload export /tmp/test-images-after-import.tar
        test -s /tmp/test-images-after-import.tar

        # The import must not add a generated import-<date>@<digest> alias for
        # an image the archive names: no registry serves that name, and the
        # export would carry it into the next archive (#8158). Names the nodes
        # carried before the import are not the import's doing.
        names="$({ tar -xOf /tmp/test-images-after-import.tar index.json 2>/dev/null ||
          tar -xOf /tmp/test-images-after-import.tar ./index.json; } |
          jq -r '.manifests[].annotations
            | (.["io.containerd.image.name"] // .["org.opencontainers.image.ref.name"] // empty)')"
        test -n "$names"
        added="$(comm -13 /tmp/test-image-names-before-import.txt <(sort -u <<<"$names"))"
        aliases="$(grep -E '(^|/)import-[0-9]{4}-[0-9]{2}-[0-9]{2}(@|:)' <<<"$added" || true)"
        if [ -n "$aliases" ]; then
          echo "❌ The import added generated aliases that the export carried:" >&2
          echo "$aliases" >&2
          exit 1
        fi
        echo "✅ Full export after import succeeded ($(du -h /tmp/test-images-after-import.tar | cut -f1)) with no generated aliases"

    - name: 🧪 Export and import images held on different nodes
      id: split-image
      if: inputs.split-image-cluster-name != ''
      shell: bash
      env:
        IMAGE_EXPORT_CLUSTER: ${{ inputs.split-image-cluster-name }}
      run: timeout --kill-after=15s 420s bash "$GITHUB_WORKSPACE/.github/actions/ksail-test-image-export-import/split-node-roundtrip.sh"

    - name: 🐞 Debug failure
      if: failure() && (steps.deploy.outcome == 'failure' || steps.export.outcome == 'failure' || steps.names-before-import.outcome == 'failure' || steps.import.outcome == 'failure' || steps.export-after-import.outcome == 'failure' || steps.split-image.outcome == 'failure')
      uses: ./.github/actions/debug-kubernetes-failure
      with:
        kubectl-command: "ksail workload"

    - name: 🧪 Cleanup export/import test workload
      if: always()
      shell: bash
      env:
        WORKLOAD_NAME: ${{ inputs.test-workload-name }}
      run: |
        ksail workload delete deployment/"$WORKLOAD_NAME" --ignore-not-found 2>/dev/null || true

    - name: 🧹 Cleanup temp files
      if: always()
      shell: bash
      run: |
        rm -f /tmp/test-images.tar /tmp/test-images-before-import.tar /tmp/test-image-names-before-import.txt /tmp/test-images-after-import.tar
