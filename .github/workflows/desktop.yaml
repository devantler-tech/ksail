name: 🧩 Desktop App

on:
  pull_request:
    paths:
      - "desktop/**"
      - "pkg/cli/uiserver/**"
      - "pkg/webui/**"
      - "web/ui/**"
      # Both entry points share the root manifest. Check dependency bumps against
      # the native build as well as the default CLI build.
      - "go.mod"
      - "go.sum"
      - ".goreleaser.desktop.yaml"
      - ".github/workflows/desktop.yaml"
      - ".github/actions/setup-desktop-build/**"
      - ".github/actions/free-disk-space/**"
      - "scripts/stage-webui.sh"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "pkg/cli/uiserver/**"
      - "pkg/webui/**"
      - "web/ui/**"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.desktop.yaml"
      - ".github/workflows/desktop.yaml"
      - ".github/actions/setup-desktop-build/**"
      - ".github/actions/free-disk-space/**"
      - "scripts/stage-webui.sh"

permissions:
  contents: read

jobs:
  build-desktop:
    name: 🏗️ Build + test (${{ matrix.platform }})
    # Wails v3's default Linux build targets GTK4 + WebKitGTK 6.0 (libgtk-4-dev + libwebkitgtk-6.0-dev),
    # which are available on ubuntu-24.04 (22.04 only ships the legacy webkit2gtk-4.0/4.1).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            binary: desktop/ksail-desktop
          - platform: Windows
            os: windows-latest
            binary: desktop/ksail-desktop.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep setup in this matrix until actionlint supports GitHub's $/ action
      # references. External actions remain pinned and repository scripts run
      # from the checked-out commit without suppressing workflow lint checks.
      - name: 🧹 Free disk space
        if: runner.os == 'Linux'
        env:
          DOCKER_PRUNE: "false"
        run: bash .github/actions/free-disk-space/free-disk-space.sh

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - name: 🐧 Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 🏗️ Build and stage web UI
        run: bash scripts/stage-webui.sh

      # Tidy includes dependencies from tagged files. Dependabot maintains this
      # same manifest, so no branch-write exception or PR exemption is needed.
      - name: 🧹 Verify shared module is tidy
        run: go mod tidy -diff

      - name: 🏗️ Build desktop app
        env:
          DESKTOP_BINARY: ${{ matrix.binary }}
        run: go build -mod=readonly -tags desktop -o "$DESKTOP_BINARY" ./desktop

      - name: 🔍 Lint desktop app
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --build-tags desktop --timeout 20m ./desktop/...

      - name: 🧪 Test desktop app
        run: go test -mod=readonly -tags desktop ./desktop

  # Validate the full macOS desktop release pipeline (build into KSail.app, archive, cask
  # generation) without publishing. --snapshot needs no secrets, so this runs on fork PRs too.
  build-macos:
    name: 🏗️ Build + cask (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - name: 🧪 Test desktop app (Darwin helpers included)
        run: go test -mod=readonly -tags desktop ./desktop

      - name: 🏗️ Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --config .goreleaser.desktop.yaml
