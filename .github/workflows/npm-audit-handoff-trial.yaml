name: NPM audit repair handoff trial

on:
  push:
    branches: [codex/npm-audit-handoff-trial-7402]

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      audit-passed: ${{ steps.audit.outputs.audit-passed }}
      repair-passed: ${{ steps.audit.outputs.repair-passed }}
      patch-created: ${{ steps.audit.outputs.patch-created }}
      changes-committed: ${{ steps.audit.outputs.changes-committed }}
      outcome: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
      - name: Prepare public vulnerable fixture
        shell: bash
        env:
          FIXTURE: ${{ github.workspace }}/.audit-fixture
          BASELINE: ${{ runner.temp }}/audit-baseline
        run: |
          mkdir -p "$FIXTURE" "$BASELINE"
          cd "$FIXTURE"
          printf '{"name":"npm-audit-handoff-fixture","version":"1.0.0","private":true}\n' > package.json
          npm install --ignore-scripts --no-audit --save-exact lodash@4.17.20
          git init --initial-branch=fixture
          git add package.json package-lock.json
          git -c user.name=Fixture -c user.email=fixture@example.invalid -c commit.gpgsign=false commit -m baseline
          cp package.json package-lock.json "$BASELINE/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-handoff-baseline
          path: ${{ runner.temp }}/audit-baseline/*
          if-no-files-found: error
      - name: Replay failing main audit with unchanged repair scripts
        id: audit
        uses: ./.github/actions/npm-audit-handoff-probe
        continue-on-error: true
        with:
          working-directory: .audit-fixture
          patch-artifact-name: npm-audit-handoff-patch
      - name: Assert failed composite still exposes truthful outputs
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_PASSED: ${{ steps.audit.outputs.audit-passed }}
          REPAIR_PASSED: ${{ steps.audit.outputs.repair-passed }}
          PATCH_CREATED: ${{ steps.audit.outputs.patch-created }}
          CHANGES_COMMITTED: ${{ steps.audit.outputs.changes-committed }}
          FIXTURE: ${{ github.workspace }}/.audit-fixture
        run: |
          test "$AUDIT_OUTCOME" = failure
          test "$AUDIT_PASSED" = false
          test "$REPAIR_PASSED" = true
          test "$PATCH_CREATED" = true
          test "$CHANGES_COMMITTED" = false
          test "$(git -C "$FIXTURE" rev-list --count HEAD)" = 1

  consumer:
    needs: producer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert downstream job receives failed composite outputs
        shell: bash
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          AUDIT_OUTCOME: ${{ needs.producer.outputs.outcome }}
          AUDIT_PASSED: ${{ needs.producer.outputs.audit-passed }}
          REPAIR_PASSED: ${{ needs.producer.outputs.repair-passed }}
          PATCH_CREATED: ${{ needs.producer.outputs.patch-created }}
          CHANGES_COMMITTED: ${{ needs.producer.outputs.changes-committed }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$AUDIT_OUTCOME" = failure
          test "$AUDIT_PASSED" = false
          test "$REPAIR_PASSED" = true
          test "$PATCH_CREATED" = true
          test "$CHANGES_COMMITTED" = false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-audit-handoff-baseline
          path: ${{ runner.temp }}/audit-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-audit-handoff-patch
          path: ${{ runner.temp }}/audit-patch
      - name: Apply and validate package-only repair
        shell: bash
        env:
          BASELINE: ${{ runner.temp }}/audit-baseline
          PATCH_PATH: ${{ runner.temp }}/audit-patch/npm-audit-producer.patch
        run: |
          cd "$BASELINE"
          git init --initial-branch=fixture
          git add package.json package-lock.json
          git -c user.name=Fixture -c user.email=fixture@example.invalid -c commit.gpgsign=false commit -m baseline
          git apply --3way "$PATCH_PATH"
          test "$(git diff --cached --name-only)" = "$(printf 'package-lock.json\npackage.json')"
          test "$(git rev-list --count HEAD)" = 1
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
