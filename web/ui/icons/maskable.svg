<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed variant of public/favicon.svg for platforms that apply their own mask (iOS Home
       Screen, Android maskable icons): no transparent corners, and the logo stays inside the
       central safe zone. Render it with `npm run gen:icons`. -->
  <defs>
    <linearGradient id="bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143150"/>
      <stop offset="1" stop-color="#0b1d2e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 258) scale(1.12) translate(-256 -258)">
    <path d="M266 340 L266 142 Q360 224 364 340 Z" fill="#f3f9fd"/>
    <path d="M246 340 L246 172 Q178 244 150 340 Z" fill="#2ec4e6"/>
    <path d="M124 352 C170 338 202 366 256 352 C310 338 342 366 388 352 L388 374 C342 388 310 360 256 374 C202 388 170 360 124 374 Z" fill="#2ec4e6"/>
  </g>
</svg>
