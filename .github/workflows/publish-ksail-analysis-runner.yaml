name: Publish KSail Analysis Runner

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-ksail-analysis-runner.yaml
      - .github/workflows/verify-ksail-arc-delivery.yaml
      - images/ksail-analysis-runner/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ksail-analysis-runner.yaml
      - .github/workflows/verify-ksail-arc-delivery.yaml
      - images/ksail-analysis-runner/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/ksail-analysis-runner
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify:
    name: Verify restricted analysis toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify publication boundary
        run: go test ./images/ksail-analysis-runner

      - name: Build pinned analysis image
        run: |
          docker build --platform linux/amd64 --tag ksail-analysis:verify images/ksail-analysis-runner

      - name: Exercise runner bootstrap and desktop compiler
        run: |
          docker run --rm --platform linux/amd64 --user 1001:1001 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --cpus 2 --env HOME=/runner-data \
            --tmpfs /runner-data:rw,exec,nosuid,nodev,uid=1001,gid=1001,size=2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,uid=1001,gid=1001,size=1g \
            ksail-analysis:verify /usr/local/bin/ksail-analysis-smoke --verify-modes

  publish:
    name: Publish and sign immutable analysis image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable analysis image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/ksail-analysis-runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Verify published runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          docker run --rm --platform linux/amd64 --user 1001:1001 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --cpus 2 --env HOME=/runner-data \
            --tmpfs /runner-data:rw,exec,nosuid,nodev,uid=1001,gid=1001,size=2g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,uid=1001,gid=1001,size=1g \
            "${IMAGE}@${DIGEST}" /usr/local/bin/ksail-analysis-smoke --verify-modes

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNING_WORKFLOW: .github/workflows/publish-ksail-analysis-runner.yaml
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/${SIGNING_WORKFLOW}@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Verify anonymous image and signature access
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNING_WORKFLOW: .github/workflows/publish-ksail-analysis-runner.yaml
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          anonymous_config=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ksail-public.XXXXXXXXXX")
          trap 'rm -rf "$anonymous_config"' EXIT
          export DOCKER_CONFIG="$anonymous_config"
          printf '%s\n' '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          timeout 180s docker pull "${IMAGE}@${DIGEST}"
          timeout 90s cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/${SIGNING_WORKFLOW}@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published public signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
