name: "TODOs"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)

jobs:
  todos:
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@946fff9cb37042f4c26c3342665727e28bd66c01 # v22.3.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
