name: "EKS Account Capacity"

# Reads regional EKS resource inventories with
# the same OIDC role the smoke test assumes (see system-test-eks.yaml for the
# AWS-side setup). It creates nothing and costs nothing: run it before spending
# a smoke-test run when node groups fail to launch for an account limit.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region to read"
        required: false
        type: string
        default: eu-central-1
      check_smoke_capacity:
        description: "Also check quota admission for the two-node t3.medium smoke candidate (read-only)"
        required: false
        type: boolean
        default: false
      capture_resource_baseline:
        description: "Capture a private regional baseline in this job (read-only; does not certify cleanup)"
        required: false
        type: boolean
        default: false

env:
  AWS_OIDC_ROLE_ARN: "arn:aws:iam::939001610192:role/eks-ci"

concurrency:
  group: eks-account-capacity
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    name: 🔎 Report EC2 Launch Capacity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ci
    permissions:
      contents: read
      id-token: write # Required to exchange GitHub's OIDC token for the scoped AWS role.
    steps:
      - name: 📄 Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        timeout-minutes: 10
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🔐 Configure AWS credentials (OIDC)
        timeout-minutes: 5
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          role-session-name: ksail-eks-account-capacity-${{ github.run_id }}
          aws-region: ${{ inputs.region }}
          role-duration-seconds: 900

      - name: 🔎 Report regional EKS resources
        timeout-minutes: 5
        shell: bash
        env:
          AWS_REGION: ${{ inputs.region }}
          CAPTURE_BASELINE: ${{ inputs.capture_resource_baseline }}
        run: |
          set -euo pipefail
          if [[ "$CAPTURE_BASELINE" == "true" ]]; then
            evidence_dir="$(mktemp -d "$RUNNER_TEMP/eks-baseline.XXXXXXXX")"
            trap 'rm -f "$evidence_dir/baseline.json"; rmdir "$evidence_dir"' EXIT
            "$GITHUB_WORKSPACE/.github/scripts/report-eks-account-capacity.sh" \
              --region "$AWS_REGION" --baseline-file "$evidence_dir/baseline.json" \
              --cluster-name regional-diagnostic --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA"
            test -s "$evidence_dir/baseline.json"
            test "$(stat -c '%a' "$evidence_dir/baseline.json")" = 600
            echo "Private baseline file verified; no manifest is uploaded."
          else
            "$GITHUB_WORKSPACE/.github/scripts/report-eks-account-capacity.sh" --region "$AWS_REGION"
          fi

      - name: 🔎 Check smoke candidate quota without creating resources
        if: inputs.check_smoke_capacity
        timeout-minutes: 5
        shell: bash
        env:
          AWS_REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          jq -cn --arg region "$AWS_REGION" '{
            apiVersion: "eksctl.io/v1alpha5", kind: "ClusterConfig",
            metadata: {name: "capacity-probe", region: $region},
            managedNodeGroups: [{name: "default", instanceType: "t3.medium",
              desiredCapacity: 1, minSize: 1, maxSize: 1}]
          }' | "$GITHUB_WORKSPACE/.github/scripts/check-eks-capacity.sh" \
            --region "$AWS_REGION" --cluster-name capacity-probe --peak-nodes 2
