name: 🔍 CodeQL

# Advanced CodeQL setup. It replaces CodeQL default setup, which is disabled for this
# repository (Settings → Code security → CodeQL analysis). The two are mutually exclusive:
# while default setup is enabled GitHub rejects this workflow's uploads, so re-enabling
# default setup turns this workflow into a failing check until it is disabled or removed.
#
# The reason to own the workflow is re-runnability. A default-setup run is GitHub-managed
# (`event: dynamic`, no workflow file in the repository), so `gh run rerun` is refused and
# an intermittent extractor failure can only be cleared by pushing a new commit — which a
# bot-authored release PR will never do, leaving it blocked indefinitely (#6767). A run of
# this workflow can simply be re-run.
#
# Go uses `autobuild`, which the Go extractor resolves to standalone extraction: it reads
# the module graph with `go list` and takes types from source, so it needs no compiler and
# covers every `go.mod` in the workspace — root, `desktop/` and `third_party/go-archive/` —
# in one job. `none` is rejected for Go, and `manual` runs a traced compile that exceeds the
# runner's memory alongside the extractor.
#
# The autobuilder runs one `go-extractor` per `go.mod`, one after another, so the job's peak
# is the largest single module. Untuned, the root module's extractor peaks above 13.4 GiB on
# a 16 GB `ubuntu-latest` runner, leaving too little headroom for the runner agent and the
# OS: the runner is then shut down part-way through extraction (`The runner has received a
# shutdown signal`, #7131). CodeQL's own `ram` and `threads` budgets do not reach the
# extractor, which is a separate Go process, and CodeQL sets no Go memory limit of its own.
# The Autobuild step therefore sets `GOMEMLIMIT`: measured on the root module, 8 GiB brings
# the extractor's peak to about 8.7 GiB while still extracting every first-party file, at the
# cost of a longer extraction (about 9 minutes instead of 6). No `ram` or `threads` cap is set,
# so CodeQL's own budget matches the default setup this replaces. Re-running a failed job
# remains available because the workflow is owned here.
#
# Same languages and suite as the default setup it replaces: actions, Go and
# JavaScript/TypeScript with the security-extended queries. This satisfies the "Require
# code scanning results" ruleset. Code-quality results cannot come from a custom workflow
# (the CodeQL Action rejects `analysis-kinds: code-quality` here), so the "Require code
# quality results" ruleset needs its own source once default setup is off.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "46 6 * * 6" # weekly

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, javascript-typescript]
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended

      - name: 🏗️ Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        env:
          # Soft heap limit for the Go extractor (a Go program), measured in #7131.
          GOMEMLIMIT: 8GiB

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
