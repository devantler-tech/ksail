<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KSail — manage local Kubernetes clusters and GitOps workloads." />
    <!-- Match the page background (slate-50 / slate-950) so browser chrome blends with the theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <title>KSail</title>
    <!-- Install metadata: lets iOS, iPadOS, macOS and Chromium add the UI to a Home Screen or Dock as
         a standalone app. Root-absolute like theme-init.js, because index.html is also served for
         nested client-side routes, where a relative href would resolve under that route. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="KSail" />
    <!-- Render-blocking, same-origin theme init (no inline script, so it passes the operator CSP). -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
