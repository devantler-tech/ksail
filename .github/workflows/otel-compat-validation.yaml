name: OTel compatibility regression

on:
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Exercise the adapter and fixed batch processor
        run: go test ./internal/otelcompat -count=1 -v
