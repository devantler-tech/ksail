name: Restore KSail Binary
description: Download and verify the exact prepared binary published by this workflow's producer

inputs:
  artifact-id:
    description: Immutable artifact ID emitted by the successful build job
    required: true
  binary-sha256:
    description: Expected SHA256 of the prepared binary emitted by the build job
    required: true
  output-path:
    description: Installation path for the verified binary
    required: false
    default: /usr/local/bin/ksail

runs:
  using: composite
  steps:
    - name: 🔍 Require producer binary artifact
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        BINARY_SHA256: ${{ inputs.binary-sha256 }}
      run: |
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Expected the exact producer artifact ID and binary checksum" >&2
          exit 1
        fi

    - name: 📥 Download producer binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/ksail-binary

    - name: 🔍 Verify and install producer binary
      shell: bash
      env:
        BINARY_DIR: ${{ runner.temp }}/ksail-binary
        BINARY_SHA256: ${{ inputs.binary-sha256 }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        binary="$BINARY_DIR/ksail"
        if [[ ! -f "$binary" || -L "$binary" || ! -s "$binary" ]]; then
          echo "Missing or invalid producer KSail binary" >&2
          exit 1
        fi
        checksum=$(sha256sum "$binary" | cut -d ' ' -f 1)
        if [[ "$checksum" != "$BINARY_SHA256" ]]; then
          echo "Producer KSail binary checksum mismatch" >&2
          exit 1
        fi
        install -m 0755 "$binary" "$OUTPUT_PATH"
