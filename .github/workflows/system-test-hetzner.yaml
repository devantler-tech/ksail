name: "System Test - Hetzner"

on:
  workflow_dispatch:
    inputs:
      init:
        description: "Run ksail project init before create"
        required: false
        type: boolean
        default: true
      cni:
        description: "Container Network Interface"
        required: false
        type: choice
        options: [Default, Cilium, Calico]
        default: Default
      csi:
        description: "Container Storage Interface"
        required: false
        type: choice
        options: [Default, Enabled, Disabled]
        default: Default
      load_balancer:
        description: "LoadBalancer support"
        required: false
        type: choice
        options: [Default, Enabled, Disabled]
        default: Default
      metrics_server:
        description: "Metrics Server"
        required: false
        type: choice
        options: [Default, Enabled, Disabled]
        default: Default
      policy_engine:
        description: "Policy engine"
        required: false
        type: choice
        options: [None, Kyverno, Gatekeeper]
        default: None
      cert_manager:
        description: "Cert-Manager"
        required: false
        type: choice
        options: [Disabled, Enabled]
        default: Disabled
      gitops_engine:
        description: "GitOps engine"
        required: false
        type: choice
        options: [None, Flux, ArgoCD]
        default: None
      control_planes:
        description: "Number of control-plane nodes"
        required: false
        type: number
        default: 1
      workers:
        description: "Number of worker nodes"
        required: false
        type: number
        default: 0
      rolling_resize_server_type:
        description: "Rolling node replacement: new Hetzner server type (e.g. cx33). Needs control_planes>=3 or workers>=1. Leave empty to skip."
        required: false
        type: string
        default: ""
  schedule:
    # Weekly: Sunday 03:00 UTC, one hour before the Omni system test, so real clusters are
    # created at most once a day. The scheduled run starts with the two direct-provider smoke
    # tests, then covers the four Talos configurations below; workflow_dispatch runs a single
    # Talos configuration on demand. Credentials come from the org-wide HCLOUD_TOKEN, scoped to
    # a dedicated Hetzner test project.
    - cron: "0 3 * * 0"

env:
  GOPROXY: "https://proxy.golang.org|direct"
  GOMEMLIMIT: "6GiB"

concurrency:
  group: system-test-hetzner
  cancel-in-progress: false
  # Keep every requested run in order instead of replacing the waiting one.
  # Runs are deliberate (a manual dispatch or the weekly schedule), and the
  # group still lets only one run create cloud resources at a time.
  queue: max

permissions: {}

jobs:
  build-artifact:
    name: 🏗️ Build KSail Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail

  warm-helm-cache:
    name: 🔥 Warm Helm Cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-artifact]
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 🔥 Warm Helm chart cache
        uses: ./.github/actions/warm-helm-cache

  warm-mirror-cache:
    name: 🔥 Warm Mirror Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-artifact]
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 🔥 Warm mirror cache
        uses: ./.github/actions/warm-mirror-cache

  system-test:
    name: "🧪 System Test (Hetzner / ${{ matrix.distribution }} / ${{ matrix.suffix }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [build-artifact, warm-helm-cache, warm-mirror-cache]
    environment: ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # On schedule: smoke the direct K3s/Vanilla provisioners first, then run all important
        # Talos configurations sequentially for broad E2E coverage. On workflow_dispatch: run a
        # single user-selected Talos configuration.
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"init":false,"distribution":"K3s","suffix":"k3s-smoke","args":"","smoke":true},{"init":false,"distribution":"Vanilla","suffix":"vanilla-smoke","args":"","smoke":true},{"init":true,"distribution":"Talos","suffix":"default-init","args":"","smoke":false},{"init":false,"distribution":"Talos","suffix":"default-noinit","args":"","smoke":false},{"init":true,"distribution":"Talos","suffix":"fullstack","args":"--cni Cilium --csi Enabled --load-balancer Enabled --metrics-server Enabled --policy-engine Kyverno --cert-manager Enabled --gitops-engine Flux --local-registry ghcr.io/devantler-tech/ksail/system-test-manifests","smoke":false},{"init":true,"distribution":"Talos","suffix":"altstack","args":"--cni Calico --csi Disabled --load-balancer Disabled --metrics-server Disabled --policy-engine Gatekeeper --gitops-engine ArgoCD --local-registry ghcr.io/devantler-tech/ksail/system-test-manifests","smoke":false}]') || fromJSON(format('[{{"init":{0},"distribution":"Talos","suffix":"dispatch","args":"","smoke":false}}]', inputs.init)) }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] - third-party action input, no environment scoping available

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 📥 Restore Helm Cache
        uses: ./.github/actions/restore-helm-cache

      - name: 📥 Restore Mirror Cache
        uses: ./.github/actions/restore-mirror-cache

      - name: 🔧 Build args string
        id: args
        shell: bash
        run: |
          ARGS="--name st-hetzner-${{ matrix.suffix }}-${{ github.run_id }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Build from user-selected inputs
            [[ "${{ inputs.cni }}" != "Default" && -n "${{ inputs.cni }}" ]] && ARGS+=" --cni ${{ inputs.cni }}"
            [[ "${{ inputs.csi }}" != "Default" && -n "${{ inputs.csi }}" ]] && ARGS+=" --csi ${{ inputs.csi }}"
            [[ "${{ inputs.load_balancer }}" != "Default" && -n "${{ inputs.load_balancer }}" ]] && ARGS+=" --load-balancer ${{ inputs.load_balancer }}"
            [[ "${{ inputs.metrics_server }}" != "Default" && -n "${{ inputs.metrics_server }}" ]] && ARGS+=" --metrics-server ${{ inputs.metrics_server }}"
            [[ "${{ inputs.policy_engine }}" != "None" && -n "${{ inputs.policy_engine }}" ]] && ARGS+=" --policy-engine ${{ inputs.policy_engine }}"
            [[ "${{ inputs.cert_manager }}" != "Disabled" && -n "${{ inputs.cert_manager }}" ]] && ARGS+=" --cert-manager ${{ inputs.cert_manager }}"
            [[ "${{ inputs.gitops_engine }}" != "None" && -n "${{ inputs.gitops_engine }}" ]] && ARGS+=" --gitops-engine ${{ inputs.gitops_engine }}"
            [[ "${{ inputs.control_planes }}" != "1" && -n "${{ inputs.control_planes }}" ]] && ARGS+=" --control-planes ${{ inputs.control_planes }}"
            [[ "${{ inputs.workers }}" != "0" && -n "${{ inputs.workers }}" ]] && ARGS+=" --workers ${{ inputs.workers }}"
          else
            # Use pre-defined matrix args for scheduled runs
            ARGS+=" ${{ matrix.args }}"
          fi

          echo "value=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "Args: ${ARGS}"

      - name: 🧪 Create Hetzner Smoke Cluster
        if: ${{ matrix.smoke == true }}
        uses: ./.github/actions/ksail-cluster
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        with:
          distribution: ${{ matrix.distribution }}
          provider: Hetzner
          args: ${{ steps.args.outputs.value }}
          init: "false"
          install: "false"
          cache: "false"

      - name: 🧪 Assert Hetzner Smoke Cluster Reachable
        if: ${{ matrix.smoke == true }}
        shell: bash
        run: |
          set -euo pipefail
          READYZ=$(ksail workload get --raw=/readyz | tr -d '\r\n')
          if [ "$READYZ" != "ok" ]; then
            echo "❌ Kubernetes API readiness probe returned: ${READYZ:-<empty>}" >&2
            exit 1
          fi
          echo "✅ Kubernetes API is reachable"

      - name: 🧹 Delete Hetzner Smoke Cluster
        if: ${{ always() && matrix.smoke == true }}
        uses: ./.github/actions/ksail-system-test-cleanup
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        with:
          distribution: ${{ matrix.distribution }}
          provider: Hetzner
          args: ${{ steps.args.outputs.value }}

      - name: 🧪 Run KSail System Test
        if: ${{ matrix.smoke != true }}
        uses: ./.github/actions/ksail-system-test
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        with:
          distribution: ${{ matrix.distribution }}
          provider: Hetzner
          init: ${{ matrix.init }}
          args: ${{ steps.args.outputs.value }}
          apply-overlay-path: ".github/fixtures/podinfo-overlay"
          test-kubernetes-provider: ${{ matrix.suffix == 'default-init' && 'true' || 'false' }}
          rolling-resize-server-type: ${{ github.event_name == 'workflow_dispatch' && inputs.rolling_resize_server_type || '' }}

          ghcr-user: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: 🧹 Cleanup Hetzner Resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [system-test]
    if: always()
    environment: ci
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Cleanup Hetzner resources (default-init)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-default-init-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (default-noinit)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-default-noinit-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (fullstack)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-fullstack-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (altstack)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-altstack-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (K3s smoke)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-k3s-smoke-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (Vanilla smoke)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-vanilla-smoke-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: 🧹 Cleanup Hetzner resources (dispatch)
        uses: ./.github/actions/cleanup-hetzner
        with:
          label-selector: "ksail.cluster.name=st-hetzner-dispatch-${{ github.run_id }}"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
