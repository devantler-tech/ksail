name: Rate Limit Gate
description: |
  Waits for sufficient GitHub API rate limit before proceeding.
  Uses exponential backoff to poll the /rate_limit endpoint (which is
  free and does not count against the quota). An unreachable API or a failed
  probe is retried within the same budget and reported as such, never as an
  exhausted rate limit. Missing authentication fails immediately.

inputs:
  min-remaining:
    description: Minimum remaining API calls required to proceed
    required: false
    default: "100"
  max-wait:
    description: >-
      Maximum wait time in seconds before failing. Keep it below the calling
      job's timeout, or the runner cancels the job before the gate can report.
    required: false
    default: "1800"

runs:
  using: composite
  steps:
    - name: ⏳ Wait for GitHub API rate limit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MIN_REMAINING: ${{ inputs.min-remaining }}
        MAX_WAIT: ${{ inputs.max-wait }}
      run: bash "$GITHUB_ACTION_PATH/wait-for-rate-limit.sh"
