# GoReleaser config for the macOS KSail desktop app.
#
# The desktop entry point shares the root Go module and links a system webview via CGO, so it
# cannot be cross-compiled in the main release; this config runs on a macOS runner and builds the
# darwin binary natively. It packages the binary into a KSail.app bundle and archives it. It publishes
# nothing itself: the cd.yaml job uploads the archive to the main release. The Homebrew tap bumps the
# `ksail-desktop` cask on its own once that release is published (devantler-tech/homebrew-tap#2568).
version: 2

project_name: ksail-desktop

dist: dist-desktop

# This runs as a second GoReleaser invocation (on a macOS runner) after the main release. Disable
# GoReleaser's own release pipe entirely: `keep-existing` looks the release up via GitHub's
# get-release-by-tag API, which does NOT return drafts, so it would not find the main run's draft and
# would instead create a brand-new — and immediately published, hence immutable — release for the tag
# (see #4874). The cd.yaml job uploads the built archive to the existing draft with `gh release upload`
# instead.
release:
  disable: true

before:
  hooks:
    # Build and stage the web UI so it is embedded in the desktop binary (see pkg/webui/embed.go).
    - bash scripts/stage-webui.sh
    - go run .github/scripts/go-notices.go stage desktop-darwin-arm64 "{{ .Tag }}" "{{ .FullCommit }}"

builds:
  - id: ksail-desktop
    main: ./desktop
    tags: [desktop]
    # Keep the binary at its final path inside the release ZIP.
    binary: KSail.app/Contents/MacOS/ksail-desktop
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w
    hooks:
      # Seal the assembled bundle, then give the archive pipe the signed executable.
      post:
        - cmd: >-
            bash desktop/scripts/make-macos-app.sh "{{ .Path }}" desktop/build/KSail.app
            "{{ .Version }}" .cache/go-notices/desktop-darwin-arm64/GoNotices
        - cmd: cp desktop/build/KSail.app/Contents/MacOS/ksail-desktop "{{ .Path }}"

archives:
  - id: ksail-desktop
    ids: [ksail-desktop]
    formats: [zip]
    wrap_in_directory: false
    name_template: "KSail_{{ .Version }}_darwin_{{ .Arch }}"
    # Archive the same resource bytes and seal that were signed with the executable.
    files:
      - src: desktop/build/KSail.app/Contents/Info.plist
        dst: KSail.app/Contents/Info.plist
      - src: desktop/build/KSail.app/Contents/Resources/AppIcon.icns
        dst: KSail.app/Contents/Resources/AppIcon.icns
      - src: LICENSE
        dst: KSail.app/Contents/Resources/LICENSE
      - src: .cache/go-notices/desktop-darwin-arm64/GoNotices/THIRD_PARTY_NOTICES.txt
        dst: KSail.app/Contents/Resources/GoNotices/THIRD_PARTY_NOTICES.txt
      - src: .cache/go-notices/desktop-darwin-arm64/GoNotices/manifest.json
        dst: KSail.app/Contents/Resources/GoNotices/manifest.json
      - src: .cache/go-notices/desktop-darwin-arm64/GoNotices/release.txt
        dst: KSail.app/Contents/Resources/GoNotices/release.txt
      - src: desktop/build/KSail.app/Contents/_CodeSignature/CodeResources
        dst: KSail.app/Contents/_CodeSignature/CodeResources
