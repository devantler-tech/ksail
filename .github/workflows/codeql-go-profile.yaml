name: CodeQL Go resource profile

# This records extraction resources and body coverage. The existing CodeQL
# analysis and managed quality checks still provide their independent verdicts.
on:
  pull_request:
    paths:
      - .github/workflows/codeql-go-profile.yaml
      - .github/scripts/profile-codeql-go*
      - internal/codeqlprofile/**
  push:
    branches: [main]
    paths:
      - .github/workflows/codeql-go-profile.yaml
      - .github/scripts/profile-codeql-go*
      - internal/codeqlprofile/**
  workflow_dispatch:
    inputs:
      heap_limit:
        description: Go extractor heap limit (off measures the untuned baseline)
        type: choice
        options: [8GiB, "off"]
        default: 8GiB

permissions: {}

concurrency:
  group: codeql-go-profile-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  profile:
    name: Measure Go extraction on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout measured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test resource measurement collection
        run: |
          go test -count=1 ./internal/codeqlprofile/...
          bash .github/scripts/profile-codeql-go.test.sh

      - name: Install desktop extraction headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Initialize CodeQL tools
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Measure every Go project and verify function bodies
        timeout-minutes: 40
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
          GOMEMLIMIT: ${{ inputs.heap_limit || '8GiB' }}
        run: bash .github/scripts/profile-codeql-go.sh "$RUNNER_TEMP/codeql-profile-report"

      - name: Preserve complete or partial normalized observations
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-go-profile-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codeql-profile-report/report.json
          if-no-files-found: error
          retention-days: 14
