---
name: Release
on:
  workflow_dispatch:
  # Auto-release: every push to main runs semantic-release (create-release.yaml).
  # Its commit-analyzer cuts a new vX.Y.Z tag only when the merged commits warrant
  # one (fix: → patch, feat: → minor, BREAKING CHANGE/! → major) and no-ops otherwise
  # (chore:/docs:/ci:). The tag push then triggers cd.yaml's GoReleaser publish.
  push:
    branches:
      - main

concurrency:
  group: "Release"
  cancel-in-progress: false
  # Keep every pending release instead of replacing it with a newer one, so a
  # burst of merges publishes each release in order.
  queue: max

permissions:
  contents: read

jobs:
  release:
    name: 🎉 Create Release
    # id-token: write lets the shared release workflow prove its identity to the
    # GitHub token broker (devantler-tech/monorepo ADR 0020) instead of minting
    # from the App key. Granting it is harmless until the workflow asks for it,
    # and it must be here first: a reusable job that asks for more than its
    # caller grants fails at startup.
    permissions:
      contents: read
      id-token: write
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@cd371c6003deca3a3b417b783da73e05b4bf690f # v22.0.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
