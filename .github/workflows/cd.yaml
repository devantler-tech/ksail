---
name: CD
on:
  push:
    tags:
      - "v*"

env:
  # Comma, not pipe: Go falls back to direct only when the proxy answers 404/410. A pipe also
  # falls back on a transient proxy error, and direct cannot serve every pinned module (a
  # test-only transitive dependency can name a tag the upstream repo no longer has), so a
  # momentary proxy blip would surface as a bogus "unknown revision" dependency failure.
  GOPROXY: "https://proxy.golang.org,direct"
  # Soft memory limit for Go build toolchain. GoReleaser links multiple
  # platform binaries and the linker can exceed runner memory.
  GOMEMLIMIT: "6GiB"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false
  # Keep every pending tag publish, so two quick releases both reach GoReleaser.
  queue: max

permissions:
  contents: read

jobs:
  validate-release-ref:
    name: 🏷️ Validate release ref
    runs-on: ubuntu-latest
    # The checks themselves take seconds. The rest is room to wait out an exhausted request budget;
    # GitHub's window is one hour.
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read # Bind a replay to successful artifact producers in the original run.
    outputs:
      release-mode: ${{ steps.release-replay.outputs.mode }}
      release-attempt: ${{ steps.release-replay.outputs.attempt }}
      replay-proof: ${{ steps.release-replay.outputs.proof }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏷️ Validate release ref
        run: .github/scripts/validate-release-ref.sh
      - name: 🔏 Install Cosign for replay verification
        if: github.run_attempt > 1
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Other automation shares this token's request budget, so the next queued tag can start
      # with it at zero and stop before anything is built (devantler-tech/ksail#7907).
      - name: ⏳ Wait for the repository token's request budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-for-github-api-budget.sh
      - name: 🔎 Resolve release replay
        id: release-replay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-release-replay.sh

  goreleaser:
    name: 🧩 Release CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [validate-release-ref]
    permissions:
      contents: write
      packages: write
      id-token: write # OIDC token for keyless cosign image signing (docker_signs)
    outputs:
      release-mode: ${{ needs.validate-release-ref.outputs.release-mode }}
      release-attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
      replay-proof: ${{ needs.validate-release-ref.outputs.replay-proof }}
      replay-latest: ${{ steps.reuse.outputs.latest }}
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      # GoReleaser cross-compiles every OS/arch and builds+signs the images in one job. That outgrew the
      # runner's root filesystem: v7.169.3 died 32 minutes in with `mkdir /tmp/go-build…: no space left
      # on device`, which surfaces as a compiler error and silently dropped the release (#6137).
      # So: reclaim more of the preinstalled toolchains, keep Go's scratch off the root filesystem, and
      # PRINT the headroom — a disk failure must never again look like a build failure.
      - name: 🧹 Cleanup node
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: |
          set -euo pipefail
          echo "::group::Disk before cleanup"
          df -h / /mnt 2>/dev/null || df -h /
          echo "::endgroup::"

          # Do NOT add /usr/local/lib/node_modules here: that directory *is* npm, and GoReleaser's
          # `before` hook runs scripts/stage-webui.sh, which builds the web UI with `npm ci`. This job
          # has no setup-node step, so removing it would break the release at the hook — the very
          # failure this change exists to prevent.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell
          sudo docker image prune --all --force
          sudo docker builder prune -a

          echo "::group::Disk after cleanup"
          df -h / /mnt 2>/dev/null || df -h /
          echo "::endgroup::"

      # Go's build scratch and cache are the bulk of the release build's disk usage and default to the
      # root filesystem. Move them to whichever volume actually has the most room — verified at runtime
      # rather than assumed, so this stays correct if the runner image changes.
      - name: 💽 Put Go build scratch on the roomiest volume
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: |
          set -euo pipefail
          root_free=$(df -Pk / | awk 'NR==2 {print $4}')
          scratch_root=""
          if mountpoint -q /mnt; then
            mnt_free=$(df -Pk /mnt | awk 'NR==2 {print $4}')
            if [ "$mnt_free" -gt "$root_free" ]; then
              scratch_root=/mnt
            fi
          fi

          if [ -z "$scratch_root" ]; then
            echo "Root filesystem has the most free space; leaving Go scratch at its default."
            exit 0
          fi

          sudo mkdir -p "$scratch_root/go-tmp" "$scratch_root/go-cache"
          sudo chown -R "$(id -u):$(id -g)" "$scratch_root/go-tmp" "$scratch_root/go-cache"
          {
            echo "GOTMPDIR=$scratch_root/go-tmp"
            echo "GOCACHE=$scratch_root/go-cache"
          } >>"$GITHUB_ENV"
          echo "Go build scratch and cache moved to $scratch_root ($(df -h "$scratch_root" | awk 'NR==2 {print $4}') free)."

      - name: ⚙️ Setup Go
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Disable module cache restoration in release workflows to avoid
          # cache-poisoning risk for runtime artifacts (see https://docs.zizmor.sh/audits/#cache-poisoning)
          cache: false

      - name: 📦 Download Go modules
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: bash .github/scripts/download-go-modules.sh

      - name: ⚙️ Setup Docker Buildx
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: 🔐 Login to GHCR
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Docker Hub
        if: (vars.DOCKERHUB_USERNAME != '') && needs.validate-release-ref.outputs.release-mode == 'build'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔏 Install Cosign
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: 🏗️ Run GoReleaser
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Verify CLI archive Go notices
        id: verify_cli_notices
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        shell: bash
        run: go run .github/scripts/go-notices.go verify-cli "$GITHUB_REF_NAME" "$GITHUB_SHA"

      # A replay redeploys the documentation only while this tag is still the latest published
      # release, so an older replay never replaces newer documentation (#7898). An unreadable
      # latest release fails closed.
      - name: ♻️ Reuse verified publication
        id: reuse
        if: needs.validate-release-ref.outputs.release-mode == 'verify'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'Reusing the immutable publication verified for %s.\n' "$GITHUB_SHA"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ -z "$latest" ]]; then
            echo '::error::Could not read the latest published release'
            exit 1
          fi
          if [[ "$latest" == "$GITHUB_REF_NAME" ]]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s is not the latest published release (%s); the documentation stays as it is.\n' \
              "$GITHUB_REF_NAME" "$latest"
            echo 'latest=false' >> "$GITHUB_OUTPUT"
          fi

  # The web UI is embedded into the binary (go:embed via pkg/webui, staged by the GoReleaser
  # before-hook) and served by the operator and `ksail open web`/`ksail open desktop` themselves — no separate UI image.

  vscode-extension:
    name: 🧩 Release VSCode Extension
    needs: [validate-release-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vsce
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      - name: ⚙️ Setup Node.js
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - name: 🏷️ Extract version from tag
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 📦 Install dependencies
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: npm ci

      - name: 🏗️ Compile
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: npm run compile

      - name: 📦 Package extension
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: npm run package

      - name: 📤 Publish to VS Code Marketplace
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: npx @vscode/vsce publish "$VERSION"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.get_version.outputs.version }}
        continue-on-error: true

      # - name: 📤 Publish to Open VSX Registry
      #   run: npx ovsx publish --pat ${{ secrets.OVSX_PAT }}
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      #   continue-on-error: true

      - name: 📦 Create VSIX package
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: npx @vscode/vsce package "$VERSION" --out ksail_"$VERSION".vsix
        env:
          VERSION: ${{ steps.get_version.outputs.version }}

      - name: 📤 Upload VSIX artifact
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        # Action inputs are workspace-relative — the job's `working-directory: vsce` default applies
        # only to `run` steps — so the vsix lives under vsce/. publish-release attaches it to the draft.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-vscode
          path: vsce/ksail_*.vsix
          if-no-files-found: error

      - name: ♻️ Reuse verified publication
        if: needs.validate-release-ref.outputs.release-mode == 'verify'
        shell: bash
        run: printf 'Reusing the immutable publication verified for %s.\n' "$GITHUB_SHA"

  # The desktop app is a tagged entry point in the shared Go module that links a system webview via
  # CGO and cannot be cross-compiled in the main release, so this job runs a second GoReleaser config
  # on a macOS runner: it builds the darwin binary and packages it as a KSail.app bundle. GoReleaser's
  # release pipe is disabled (see .goreleaser.desktop.yaml); the built archive is emitted as a
  # workflow artifact and attached to the draft by `publish-release`. No `needs: [goreleaser]` — this
  # builds in parallel with the CLI release. The Homebrew tap bumps the `ksail-desktop` cask itself
  # once the release is published (devantler-tech/homebrew-tap#2568).
  desktop-macos:
    name: 🧩 Release Desktop App (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [validate-release-ref]
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      - name: ⚙️ Setup Go
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: ⚙️ Setup Node.js
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - name: 📦 Download Go modules
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: bash .github/scripts/download-go-modules.sh

      - name: 🏗️ Run GoReleaser (desktop)
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.desktop.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser's release pipe is disabled (.goreleaser.desktop.yaml). Emit the macOS archive as a
      # workflow artifact; `publish-release` attaches it to the draft before publishing, so every asset
      # is present before the release is locked by immutable releases (see #4874).
      - name: 🔎 Verify macOS desktop archive Go notices
        id: verify_macos_notices
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        shell: bash
        run: go run .github/scripts/go-notices.go verify desktop-darwin-arm64 "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: 🔎 Verify macOS desktop archive signature
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        run: bash desktop/scripts/verify-macos-archive.sh dist-desktop/KSail_*_darwin_*.zip

      - name: 📤 Upload desktop archive artifact
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-desktop-macos
          path: dist-desktop/KSail_*_darwin_*.zip
          if-no-files-found: error

      - name: ♻️ Reuse verified publication
        if: needs.validate-release-ref.outputs.release-mode == 'verify'
        shell: bash
        run: printf 'Reusing the immutable publication verified for %s.\n' "$GITHUB_SHA"

  # Linux and Windows desktop binaries are convenience downloads. They build on native
  # runners (CGO + the system webview) in parallel with the CLI release and emit their archives as
  # workflow artifacts; `publish-release` attaches them to the draft before publishing, so every asset
  # is present before the release is locked by immutable releases (see #4874).
  desktop:
    name: 🧩 Release Desktop App
    needs: [validate-release-ref]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wails v3's default Linux build targets GTK4 + WebKitGTK 6.0 (libgtk-4-dev +
          # libwebkitgtk-6.0-dev), available on ubuntu-24.04 (22.04 only ships legacy webkit2gtk).
          - { os: ubuntu-24.04, goos: linux, arch: amd64, ext: "" }
          - { os: windows-latest, goos: windows, arch: amd64, ext: ".exe" }
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      - name: 🛠️ Setup desktop build (Go, Node.js, webview deps, staged web UI)
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: devantler-tech/ksail/.github/actions/setup-desktop-build@87ab9e1093b895fdeb2bdbac3664031615283d31

      - name: 🏷️ Extract version from tag
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build desktop app
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD -- web/ui
          if [[ ! -s pkg/webui/dist/index.html ]]; then
            printf 'The release checkout has no staged desktop web UI.\n' >&2
            exit 1
          fi
          cd desktop
          go build -tags desktop -ldflags "-s -w" -o "ksail-desktop${{ matrix.ext }}" .

      # Package so the artifact extracts to the name the `ksail open desktop` launcher looks for: a
      # ksail-desktop binary the user puts on their PATH. Naming mirrors the main GoReleaser archives.
      - name: 📦 Package desktop app
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          target="desktop-$GOOS-$ARCH"
          go run .github/scripts/go-notices.go stage "$target" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          case "$GOOS" in
            linux)
              artifact="ksail-desktop_${VERSION}_linux_${ARCH}.tar.gz"
              if [ -e "$artifact" ] || [ -L "$artifact" ]; then exit 1; fi
              tar -czf "$artifact" -C desktop ksail-desktop -C "$PWD" LICENSE -C "$PWD/.cache/go-notices/$target" GoNotices
              ;;
            windows)
              artifact="ksail-desktop_${VERSION}_windows_${ARCH}.zip"
              if [ -e "$artifact" ] || [ -L "$artifact" ]; then exit 1; fi
              7z a "$artifact" "./desktop/ksail-desktop.exe" LICENSE
              archive_path="$PWD/$artifact"
              (cd ".cache/go-notices/$target" && 7z a "$archive_path" GoNotices)
              ;;
            *) exit 1 ;;
          esac
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify desktop archive Go notices
        id: verify_desktop_notices
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          ARCH: ${{ matrix.arch }}
        run: go run .github/scripts/go-notices.go verify "desktop-$GOOS-$ARCH" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: 📤 Upload desktop archive artifact
        if: needs.validate-release-ref.outputs.release-mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-desktop-${{ matrix.goos }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

      - name: ♻️ Reuse verified publication
        if: needs.validate-release-ref.outputs.release-mode == 'verify'
        shell: bash
        run: printf 'Reusing the immutable publication verified for %s.\n' "$GITHUB_SHA"

  operator-chart:
    name: ⛵ Release Operator Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate on `goreleaser` (image build + cosign sign + push). The chart's appVersion is the
    # release version and operator.image.tag defaults to it, so the chart references
    # ghcr.io/devantler-tech/ksail:v<version>. Publishing the chart before that image exists
    # produces an orphan chart pointing at a missing image: on the failed v7.74.1 run the
    # `goreleaser` job failed (no image built/signed) but this job had already pushed
    # ksail-operator:7.74.1, which downstream cosign image-verification then rejects with
    # MANIFEST_UNKNOWN. `needs: goreleaser` keeps the chart and image release atomic — a failed
    # or incomplete image build skips the chart publish instead of orphaning it. The gated
    # `publish-release` and `pages-deploy` jobs both list this job in `needs`, so a chart
    # publish failure still blocks the GitHub release publish and the docs deploy.
    needs: [goreleaser]
    permissions:
      contents: read # checkout
      packages: write # push the chart to GHCR as an OCI artifact
      id-token: write # keyless signing of the chart manifest
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.goreleaser.outputs.release-attempt }}
          mode: ${{ needs.goreleaser.outputs.release-mode }}
          proof: ${{ needs.goreleaser.outputs.replay-proof }}

      - name: 🔐 Login to GHCR
        if: needs.goreleaser.outputs.release-mode == 'build'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # helm is pre-installed on ubuntu-latest runners (CI's operator-chart-lint relies on this too).
      # Pin the chart version AND appVersion to the release version so the published chart pulls the
      # matching operator image (operator.image.tag defaults to .Chart.AppVersion); helm bundles crds/
      # automatically. The chart lands at ghcr.io/devantler-tech/charts/ksail-operator:<version>.
      - name: 🔏 Install Cosign
        if: needs.goreleaser.outputs.release-mode == 'build'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: 📦 Publish signed operator chart
        if: needs.goreleaser.outputs.release-mode == 'build'
        run: bash .github/scripts/publish-operator-chart.sh

      - name: ♻️ Reuse verified publication
        if: needs.goreleaser.outputs.release-mode == 'verify'
        shell: bash
        run: printf 'Reusing the immutable publication verified for %s.\n' "$GITHUB_SHA"

  mcp-publish:
    name: 📤 Publish to MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs `goreleaser` for the published GHCR image that server.json points at, but runs in
    # parallel with `publish-release` and `pages-deploy` — neither lists it in `needs`. The MCP
    # registry publish references the container image (pushed by `goreleaser`), not the GitHub
    # release, so it is independent of the draft→published flip and need not gate it.
    needs: [goreleaser]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.goreleaser.outputs.release-attempt }}
          mode: ${{ needs.goreleaser.outputs.release-mode }}
          proof: ${{ needs.goreleaser.outputs.replay-proof }}

      - name: 🏷️ Extract version from tag
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 📝 Update server.json version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          IMAGE_TAG: ${{ steps.get_version.outputs.image_tag }}
        run: |
          jq --arg v "$VERSION" \
             --arg tag "$IMAGE_TAG" \
             '.version = $v | .packages[0].identifier = "ghcr.io/devantler-tech/ksail:" + $tag' \
             server.json > server.json.tmp && mv server.json.tmp server.json

      - name: 📥 Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.8/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.8/registry_1.7.8_checksums.txt"
          grep "mcp-publisher_linux_amd64.tar.gz$" registry_1.7.8_checksums.txt | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          rm mcp-publisher_linux_amd64.tar.gz registry_1.7.8_checksums.txt

      - name: 🔐 Authenticate with MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: 📤 Publish to MCP Registry
        run: bash .github/scripts/publish-mcp-registry.sh

  pages-build:
    name: 📄 Build Pages
    needs: [validate-release-ref]
    runs-on: ubuntu-latest
    # Runs in parallel with the other releases (no GoReleaser artifact dependency). The
    # gated `pages-deploy` and `publish-release` jobs both list it in `needs`, so a docs
    # build failure blocks both the Pages deploy and the GitHub release publish.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: ⚙️ Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 📦 Install dependencies
        working-directory: docs
        run: npm ci

      - name: 🏗️ Build with Astro
        working-directory: docs
        run: npm run build

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  pages-deploy:
    name: 🚀 Deploy Pages
    runs-on: ubuntu-latest
    # Gate the docs deploy on the artifact-producing releases (not just `pages-build`) so a
    # partial release failure never pushes a fresh docs site. Runs in parallel with
    # `publish-release` and `mcp-publish` — none depends on the others. `mcp-publish` is
    # excluded from `needs` because the MCP registry publish is independent of the docs site.
    needs:
      [
        goreleaser,
        vscode-extension,
        desktop-macos,
        desktop,
        operator-chart,
        pages-build,
      ]
    timeout-minutes: 10
    permissions:
      pages: write # Publish the verified documentation artifact.
      id-token: write # Authenticate the Pages deployment through OIDC.
    steps:
      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.goreleaser.outputs.release-attempt }}
          mode: ${{ needs.goreleaser.outputs.release-mode }}
          proof: ${{ needs.goreleaser.outputs.replay-proof }}

      - name: 🚀 Deploy to GitHub Pages
        if: needs.goreleaser.outputs.release-mode == 'build' || needs.goreleaser.outputs.replay-latest == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish-release:
    name: 📢 Publish Release
    runs-on: ubuntu-latest
    # Room for the asset upload's full retry backoff on top of the rest of the job
    # (upload-release-assets.test.sh keeps the two in step).
    timeout-minutes: 10
    # Gate on EVERY artifact-producing asset job so the draft is flipped to published only when the
    # release is COMPLETE (CLI tarballs + checksums + CRD, VSIX, and every desktop archive present).
    # Immutable releases (see #4874) forbid adding assets after the flip, so completeness must be
    # guaranteed before it. This is the maintainer's required invariant: a published release is always
    # complete (#5061). The inverse failure — an asset job failing and leaving an unpublished draft —
    # is prevented up front by the `Release` workflow, which validates every artifact BEFORE the tag is
    # created, and backstopped by `cleanup-failed-release` below, which deletes an orphaned draft
    # while retaining the protected tag and reporting the failed version (#7694).
    # Runs in parallel with `pages-deploy` and `mcp-publish`.
    needs:
      [
        goreleaser,
        vscode-extension,
        desktop-macos,
        desktop,
        operator-chart,
        pages-build,
      ]
    permissions:
      contents: write
      actions: read # Independently recheck the original publisher jobs.
    steps:
      - name: 🏷️ Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Check out before downloading: on a fresh workspace checkout clears the directory, which
      # would delete the downloaded assets the resolver and upload below need.
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.goreleaser.outputs.release-attempt }}
          mode: ${{ needs.goreleaser.outputs.release-mode }}
          proof: ${{ needs.goreleaser.outputs.replay-proof }}

      - name: 📥 Download release asset artifacts
        if: needs.goreleaser.outputs.release-mode == 'build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-assets

      # Rerunning an upstream asset job reruns this one too. If the tag's release is already
      # published and complete, there is nothing left to attach or publish — and an immutable
      # release rejects the upload — so the rerun succeeds as a no-op. Missing, duplicate or
      # incomplete releases fail closed here (see #6263).
      - name: 🔎 Resolve release publish state
        if: needs.goreleaser.outputs.release-mode == 'build'
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
        # The Cluster CRD is attached by GoReleaser rather than downloaded here, so name it explicitly;
        # GoReleaser's archives are required from the release's own checksums file.
        run: >-
          .github/scripts/resolve-release-publish-state.sh --tag "$RELEASE_TAG" --assets-dir dist-assets
          --extra-assets-glob 'charts/ksail-operator/crds/*.yaml'

      # Attach the desktop archives and the VSIX to the draft BEFORE publishing. Once published the
      # release is immutable and late uploads 422 (see #4874); all asset jobs gate this one, so every
      # artifact exists here and is attached immediately before the draft→published flip below.
      # The upload retries with backoff: a single transient failure from uploads.github.com would
      # otherwise skip publishing and every downstream job, stranding the release as a draft (#6292).
      - name: 📤 Attach assets to draft release
        if: (steps.release_state.outputs.state == 'draft') && needs.goreleaser.outputs.release-mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
        run: .github/scripts/upload-release-assets.sh --tag "$RELEASE_TAG" --assets-dir dist-assets

      - name: 📢 Publish draft release
        if: (steps.release_state.outputs.state == 'draft') && needs.goreleaser.outputs.release-mode == 'build'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;

            // List every page of releases and find the one(s) matching the tag
            // Note: getReleaseByTag does not return draft releases, so we use listReleases instead
            let matching;
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              matching = releases.filter(r => r.tag_name === tag);
            } catch (error) {
              core.setFailed(`Failed to list releases: ${error.message}`);
              throw error;
            }

            if (matching.length === 0) {
              core.setFailed(`Release not found for tag ${tag}`);
              return;
            }

            // More than one release for a tag means an asset job created a duplicate (e.g. a second
            // GoReleaser run that couldn't see the draft) — see #4874. Bail before publishing rather
            // than racing an immutable release into existence; the duplicate needs manual cleanup.
            if (matching.length > 1) {
              const ids = matching.map(r => `${r.id} (draft=${r.draft})`).join(', ');
              core.setFailed(`Found ${matching.length} releases for tag ${tag}: ${ids}. Expected exactly one — manual cleanup required.`);
              return;
            }

            const release = matching[0];

            // The public install command is intentionally excluded from link checking while this
            // draft is still the first release that can create it. Preserve the user contract at
            // the authoritative boundary instead: immutable publication must fail closed unless
            // both the installer and the checksum manifest it consumes are present and non-empty.
            const version = tag.replace(/^v/, '');
            const requiredInstallerAssets = [
              'install.sh',
              `ksail_${version}_checksums.txt`,
            ];
            const assetsByName = new Map(release.assets.map(asset => [asset.name, asset]));
            const missingInstallerAssets = requiredInstallerAssets.filter(name => {
              const asset = assetsByName.get(name);
              return !asset || asset.size <= 0;
            });
            if (missingInstallerAssets.length > 0) {
              core.setFailed(
                `Release ${tag} is missing required installer release assets: ${missingInstallerAssets.join(', ')}`,
              );
              return;
            }

            if (!release.draft) {
              console.log(`Release ${tag} is already published`);
              return;
            }

            // Publish the release
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              // A retried older tag must not replace a newer stable release as latest (#7898).
              // GitHub's legacy policy selects by creation date and semantic version.
              make_latest: 'legacy',
            });

            console.log(`Successfully published release ${tag}`);

      - name: 🔏 Install Cosign for replay readback
        if: needs.goreleaser.outputs.release-mode == 'verify'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: 🔎 Recheck immutable release proof
        if: needs.goreleaser.outputs.release-mode == 'verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY_EXPECTED: ${{ needs.goreleaser.outputs.replay-proof }}
        run: bash .github/scripts/resolve-release-replay.sh

  # Backstop for the immutable-release model: if the release did NOT publish — any asset job failed,
  # or the publish step bailed (so `publish-release` is skipped or failed) — delete only its eligible
  # orphaned draft. Release tags remain undeletable, including failed attempts; a newer published
  # version supersedes a failed version (#7694). This cleanup never changes the failed publisher's
  # outcome and never removes a published release or an ambiguous draft set.
  cleanup-failed-release:
    name: 🧹 Clean up incomplete release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-release-ref, publish-release]
    if: always() && needs.publish-release.result != 'success' && needs.validate-release-ref.result == 'success'
    permissions:
      contents: write
    steps:
      - name: 🔒 Verify release admission
        uses: devantler-tech/ksail/.github/actions/release-admission@ac2dd2ee401030b2fac81dc985b42fae45b0788b
        with:
          attempt: ${{ needs.validate-release-ref.outputs.release-attempt }}
          mode: ${{ needs.validate-release-ref.outputs.release-mode }}
          proof: ${{ needs.validate-release-ref.outputs.replay-proof }}

      - name: 🧹 Delete orphaned draft release and retain its tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const source = process.env.GITHUB_SHA;
            const { owner, repo } = context.repo;
            if (!/^v\d+\.\d+\.\d+(-.+)?$/.test(tag || '') || !/^[0-9a-f]{40}$/.test(source || '')) {
              throw new Error('Cleanup requires the admitted release tag and source commit.');
            }

            // listReleases returns drafts (getReleaseByTag does not), so use it to find everything
            // attached to this tag, reading every page so a release beyond the first 100 is not missed.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (!Array.isArray(releases) || releases.some(r => !r || typeof r.tag_name !== 'string')) {
              throw new Error('Release listing is unreadable; leaving releases and tags untouched.');
            }
            const forTag = releases.filter(r => r.tag_name === tag);
            if (forTag.some(r => typeof r.draft !== 'boolean' || !Number.isSafeInteger(r.id) || r.id <= 0)) {
              throw new Error('Release identity is incomplete; leaving releases and tags untouched.');
            }
            const drafts = forTag.filter(r => r.draft);
            const published = forTag.filter(r => !r.draft);

            // If a published release coexists with a draft for this tag, we're in the ambiguous
            // duplicate-release case (#4874) — the draft may hold the ONLY complete artifact set, so
            // auto-deleting it could strand an incomplete published release as the only survivor.
            // Leave both the draft(s) and the tag for manual investigation (mirrors publish-release's
            // matching>1 bail), and never delete a tag that backs a published release.
            if (published.length > 0) {
              core.warning(`A published release exists for ${tag} alongside ${drafts.length} draft(s); leaving the draft(s) and the tag for manual cleanup (see #4874).`);
              return;
            }

            if (drafts.length > 1) {
              throw new Error(`Multiple draft releases exist for ${tag}; leaving the ambiguous drafts untouched.`);
            }

            // Match the preflight's bounded annotated-tag resolution. Only fixed same-repository
            // API operands are used; a missing, unreadable or moved source tag refuses cleanup.
            async function verifyRetainedTag() {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.data.ref !== `refs/tags/${tag}`) throw new Error('Source tag identity differs.');
              let object = ref.data.object;
              for (let depth = 0; depth < 4; depth++) {
                if (!object || !/^[0-9a-f]{40}$/.test(object.sha || '')) break;
                if (object.type === 'commit') {
                  if (object.sha === source) return;
                  break;
                }
                if (object.type !== 'tag') break;
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
                object = annotated.data.object;
              }
              throw new Error('Retained tag does not identify the admitted source commit.');
            }

            await verifyRetainedTag();
            for (const d of drafts) {
              const current = await github.rest.repos.getRelease({ owner, repo, release_id: d.id });
              if (current.data.id !== d.id || current.data.tag_name !== tag || current.data.draft !== true) {
                throw new Error('Draft identity changed before cleanup; leaving it untouched.');
              }
              await github.rest.repos.deleteRelease({ owner, repo, release_id: d.id });
              try {
                await github.rest.repos.getRelease({ owner, repo, release_id: d.id });
                throw new Error('Draft release still exists after cleanup.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              console.log(`Deleted orphaned draft release ${tag} (id=${d.id}).`);
            }
            await verifyRetainedTag();
            await core.summary.addHeading('Incomplete release cleanup').addRaw(
              `Retained tag ${tag} at source ${source}. ` +
              `Removed ${drafts.length} orphaned draft release(s); tag protection is unchanged.\n\n` +
              `Recovery requires a newer published version; this job does not verify a successor. ` +
              `Cleanup does not change the original failed publication outcome.\n`
            ).write();
