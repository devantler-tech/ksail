name: CI - KSail

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      run_system_tests:
        description: "Run system tests"
        required: false
        type: boolean
        default: true

env:
  # Use pipe (|) instead of comma (,) so Go falls through to direct on ANY proxy
  # error (including 403), not just 404/410. Hardens CI against transient
  # proxy.golang.org outages. go.sum still verifies module integrity.
  GOPROXY: "https://proxy.golang.org|direct"
  # Soft memory limit for Go build toolchain (compiler, linker). The KSail
  # binary links a large dependency tree and the Go linker can exceed the
  # default runner memory on cache-miss builds. Setting GOMEMLIMIT makes the
  # GC work harder to stay within budget, reducing peak RSS.
  GOMEMLIMIT: "6GiB"

concurrency:
  # On main each run is its own verification record, so it gets a run-unique
  # group. Sharing a group there is not made safe by cancel-in-progress alone: a
  # group holds one running plus one pending run, and a third merge cancels the
  # pending one — so the second merge's checks would still be lost. A unique key
  # means nothing on main ever queues behind, or evicts, anything else.
  #
  # Pull requests and merge-queue entries keep the ref-keyed group, so superseded
  # runs there still cancel exactly as before.
  group: "ci-ksail-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # cancel-stale-merge-queue — kept for future use when jobs are moved to merge_group
  # cancel-stale-merge-queue:
  #   name: 🧹 Cancel Stale Merge Queue Runs
  #   if: github.event_name == 'merge_group'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 2
  #   permissions:
  #     actions: write
  #   steps:
  #     - name: Cancel previous runs for same merge queue entry
  #       uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
  #       with:
  #         script: |
  #           const ref = context.ref;
  #           const match = ref.match(/^(refs\/heads\/gh-readonly-queue\/.+)-[0-9a-f]+$/);
  #           if (!match) {
  #             console.log('Not a merge queue ref, skipping');
  #             return;
  #           }
  #           const stablePrefix = match[1];
  #
  #           for (const status of ['in_progress', 'queued']) {
  #             let page = 1;
  #             while (true) {
  #               const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
  #                 owner: context.repo.owner,
  #                 repo: context.repo.repo,
  #                 workflow_id: 'ci.yaml',
  #                 event: 'merge_group',
  #                 status,
  #                 per_page: 100,
  #                 page,
  #               });
  #
  #               if (runs.length === 0) break;
  #
  #               for (const run of runs) {
  #                 if (run.run_number >= context.runNumber) continue;
  #                 const runRef = `refs/heads/${run.head_branch}`;
  #                 const runMatch = runRef.match(/^(refs\/heads\/gh-readonly-queue\/.+)-[0-9a-f]+$/);
  #                 if (runMatch && runMatch[1] === stablePrefix) {
  #                   console.log(`Cancelling stale run ${run.id} (${runRef})`);
  #                   try {
  #                     await github.rest.actions.cancelWorkflowRun({
  #                       owner: context.repo.owner,
  #                       repo: context.repo.repo,
  #                       run_id: run.id,
  #                     });
  #                   } catch (error) {
  #                     if (error && (error.status === 409 || error.status === 422)) {
  #                       console.log(`Skipping run ${run.id}; it is no longer cancellable (${error.status})`);
  #                       continue;
  #                     }
  #                     throw error;
  #                   }
  #                 }
  #               }
  #
  #               if (runs.length < 100) break;
  #               page += 1;
  #             }
  #           }

  # Wait for sufficient GitHub API rate limit before proceeding
  rate-limit-gate:
    name: ⏳ Rate Limit Gate
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rate-limit-gate

  # Detect which file categories changed to conditionally run jobs
  changes:
    name: 🔍 Detect Changes
    if: github.event_name != 'merge_group'
    needs: [rate-limit-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      dependency-test-graph: ${{ steps.filter.outputs.dependency-test-graph }}
      govuln-allowlist: ${{ steps.filter.outputs.govuln-allowlist }}
      todos-contract: ${{ steps.filter.outputs.todos-contract }}
      system-test: ${{ steps.filter.outputs.system-test }}
      schema: ${{ steps.filter.outputs.schema }}
      cli: ${{ steps.filter.outputs.cli }}
      vsce: ${{ steps.filter.outputs.vsce }}
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      vsce-deps: ${{ steps.filter.outputs.vsce-deps }}
      copilot-plugin: ${{ steps.filter.outputs.copilot-plugin }}
      operator-chart: ${{ steps.filter.outputs.operator-chart }}
      desktop: ${{ steps.filter.outputs.desktop }}
      calico-cni: ${{ steps.filter.outputs.calico-cni }}
      cask-pr-handoff: ${{ steps.filter.outputs.cask-pr-handoff }}
      eks-smoke-scripts: ${{ steps.filter.outputs.eks-smoke-scripts }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.govulncheck-allow.txt'
              - '.github/actions/**'
            # The Go harness in internal/ciharness asserts the shape of the to-do scanner
            # caller. Its subject is a WORKFLOW file, not a Go file, so the org-required
            # validate-go-project run cannot reach it: that workflow gates its own test job
            # on a `go` filter of **/*.go|go.mod|go.sum|.golangci.* and skips everything
            # else. A scanner-only bump therefore merges with the contract unexecuted and
            # reddens main instead (ksail#6750 merged 2026-08-28T17:17Z with its test job
            # `skipped`; main went red 94 minutes later). This filter feeds a job of its own
            # so that class of change is gated on the PR that makes it. The harness sources
            # and THIS workflow are included for the same reason dependency-test-graph
            # includes ci.yaml below: the job and its assertions both live in files this
            # filter would otherwise not match, so a PR editing only one of them could
            # weaken or delete the gate while the aggregator recorded it as an ordinary
            # skip.
            # ("to-do" is deliberately lowercase and hyphenated here: the scanner keys on the
            # uppercase marker, so spelling it out in prose files an issue against this very
            # comment. ksail#6763 was exactly that — a false positive with no work behind it.)
            todos-contract:
              - '.github/workflows/todos.yaml'
              - '.github/workflows/ci.yaml'
              - 'internal/ciharness/**'
            # Deliberately NARROWER than `code`: the job resolves a module graph, so only the
            # module files matter — not every .go file. It also includes THIS workflow, because
            # the check lives here and a workflow-only PR would otherwise be able to weaken or
            # delete it without ever running it.
            dependency-test-graph:
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yaml'
            govuln-allowlist:
              - '.govulncheck-allow.txt'
            system-test:
              # NOTE: Do not use negative patterns (!) here.
              # dorny/paths-filter v4 uses picomatch where negated patterns
              # like '!**/*_test.go' match ANY file that is not a test file
              # (including .mdx, .json, etc.), causing docs-only PRs to
              # falsely trigger system tests.
              # Use an explicit allowlist of directories whose changes truly
              # require system tests (cluster/workload code, providers,
              # provisioners, installers, client libraries). Chat, MCP,
              # cipher, toolgen, docs generators, and schema generators are
              # intentionally omitted.
              - 'main.go'
              - 'internal/buildmeta/**'
              - 'pkg/apis/**'
              - 'pkg/cli/annotations/**'
              - 'pkg/cli/cmd/cluster/**'
              - 'pkg/cli/cmd/workload/**'
              - 'pkg/cli/cmd/tenant/**'
              - 'pkg/cli/dockerutil/**'
              - 'pkg/cli/editor/**'
              - 'pkg/cli/flags/**'
              - 'pkg/cli/kubeconfig/**'
              - 'pkg/cli/kubeconfighook/**'
              - 'pkg/cli/lifecycle/**'
              - 'pkg/cli/setup/**'
              - 'pkg/cli/ui/asciiart/**'
              - 'pkg/cli/ui/confirm/**'
              - 'pkg/cli/ui/errorhandler/**'
              - 'pkg/cli/ui/picker/**'
              - 'pkg/client/**'
              - 'pkg/di/**'
              - 'pkg/envvar/**'
              - 'pkg/fsutil/**'
              - 'pkg/k8s/**'
              - 'pkg/notify/**'
              - 'pkg/runner/**'
              - 'pkg/svc/detector/**'
              - 'pkg/svc/diff/**'
              - 'pkg/svc/image/**'
              - 'pkg/svc/installer/**'
              - 'pkg/svc/provider/**'
              - 'pkg/svc/provisioner/**'
              - 'pkg/svc/registryresolver/**'
              - 'pkg/svc/state/**'
              - 'pkg/svc/tenant/**'
              - 'pkg/svc/versionresolver/**'
              - 'pkg/timer/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/actions/**'
              - '.github/fixtures/**'
              - '.github/workflows/ci.yaml'
            schema:
              - 'pkg/apis/**/*.go'
              - 'go.mod'
              - 'schemas/gen_schema.go'
            cli:
              - 'cmd/**/*.go'
              - 'pkg/**/*.go'
              - 'go.mod'
              - 'docs/gen_docs.go'
              - 'docs/gen_docs_prose.go'
            vsce:
              - 'vsce/**'
              - '.github/workflows/ci.yaml'
            docs:
              # Matches docs content (MDX, Astro, config) but not Go generators.
              # Avoid negative patterns — see system-test comment above.
              - 'docs/src/**'
              - 'docs/public/**'
              - 'docs/astro.config.*'
              - 'docs/tsconfig.json'
              - 'docs/package*.json'
              - 'docs/.npmrc'
              - '.github/workflows/ci.yaml'
            docs-deps:
              - 'docs/package*.json'
            vsce-deps:
              - 'vsce/package*.json'
            copilot-plugin:
              - 'copilot-plugin/**'
              - '.github/plugin/**'
              - '.claude-plugin/**'
              - '.github/workflows/ci.yaml'
            operator-chart:
              # Operator Helm chart E2E. Covers the chart, the web UI, the
              # operator runtime (`ksail operator` subcommand), the reconciler,
              # the Cluster CRD types, and the image build inputs.
              - 'charts/ksail-operator/**'
              - 'web/ui/**'
              - 'pkg/operator/**'
              - 'internal/controller/**'
              - 'pkg/cli/cmd/operator/**'
              - 'pkg/apis/**'
              - 'Dockerfile'
              - '.github/actions/operator-chart-e2e/**'
              - 'scripts/stage-webui.sh'
              - '.github/workflows/ci.yaml'
            desktop:
              # The desktop app is a SEPARATE Go module that vendors the main
              # module via `replace => ../`, so its go.{mod,sum} must track the
              # main module's dependency graph independently. A root dependency
              # bump (go.mod/go.sum) does NOT touch desktop/**, so it must be
              # listed here or desktop drift slips through to release. Keep
              # go.mod/go.sum in this filter.
              - 'desktop/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yaml'
            calico-cni:
              # The Calico installer derives the tigera-operator chart version
              # from the calico/node image tag in this Dockerfile (see
              # version.go's chartVersion()). A node-image patch can outpace the
              # operator chart release, leaving the derived version unpublished,
              # so guard a bump to this file with validate-calico-chart.
              - 'pkg/svc/installer/cni/calico/Dockerfile'
              - '.github/workflows/ci.yaml'
            cask-pr-handoff:
              - '.github/fixtures/cask-pr-handoff/**'
              - '.github/scripts/cask-pr-handoff-workflow.test.sh'
              - '.github/scripts/collect-cask-pr-handoff.sh'
              - '.github/scripts/collect-cask-pr-handoff.test.sh'
              - '.github/scripts/find-merged-cask-pr-handoff.sh'
              - '.github/scripts/find-merged-cask-pr-handoff.test.sh'
              - '.github/scripts/redraft-evergreen-cask-prs.sh'
              - '.github/scripts/redraft-evergreen-cask-prs.test.sh'
              - '.github/scripts/validate-cask-pr-handoff.sh'
              - '.github/scripts/validate-cask-pr-handoff.test.sh'
              - '.github/workflows/cd.yaml'
              - '.github/workflows/ci.yaml'
            eks-smoke-scripts:
              - '.github/scripts/delete-eks-smoke-cluster.sh'
              - '.github/scripts/delete-eks-smoke-cluster.test.sh'
              - '.github/workflows/system-test-eks.yaml'
              - '.github/workflows/ci.yaml'

  eks-smoke-scripts:
    name: 🧹 Validate EKS Smoke Teardown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: needs.changes.outputs.eks-smoke-scripts == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Verify EKS smoke teardown reports only real leaks
        run: |
          shellcheck \
            .github/scripts/delete-eks-smoke-cluster.sh \
            .github/scripts/delete-eks-smoke-cluster.test.sh
          .github/scripts/delete-eks-smoke-cluster.test.sh

  cask-pr-handoff:
    name: 🔐 Validate Cask PR Handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: needs.changes.outputs.cask-pr-handoff == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Verify fail-closed cask PR handoff
        run: |
          shellcheck \
            .github/fixtures/cask-pr-handoff/fake-bin/gh \
            .github/scripts/collect-cask-pr-handoff.sh \
            .github/scripts/collect-cask-pr-handoff.test.sh \
            .github/scripts/find-merged-cask-pr-handoff.sh \
            .github/scripts/find-merged-cask-pr-handoff.test.sh \
            .github/scripts/redraft-evergreen-cask-prs.sh \
            .github/scripts/redraft-evergreen-cask-prs.test.sh \
            .github/scripts/validate-cask-pr-handoff.sh \
            .github/scripts/validate-cask-pr-handoff.test.sh \
            .github/scripts/cask-pr-handoff-workflow.test.sh
          .github/scripts/collect-cask-pr-handoff.test.sh
          .github/scripts/find-merged-cask-pr-handoff.test.sh
          .github/scripts/redraft-evergreen-cask-prs.test.sh
          .github/scripts/validate-cask-pr-handoff.test.sh
          .github/scripts/cask-pr-handoff-workflow.test.sh

  ci-go:
    name: ✅ Validate Go Project
    needs: [changes]
    # The two arms below cover what the ORG-REQUIRED workflow does not, and nothing
    # more. validate-go-project.yaml carries its own `pull_request:` / `merge_group:`
    # triggers alongside its `workflow_call` interface, so GitHub already runs the
    # complete Go suite directly on every pull request here, with no help from this
    # file. That direct run publishes its checks WITHOUT the `✅ Validate Go Project /`
    # prefix, which is why a prefix-filtered read of a pull request shows "skipped"
    # over a suite that has in fact passed (ksail#6563, ksail#6564 — both closed as
    # measurement errors of exactly that shape).
    #
    #   * push to main — the required workflow is pull-request scoped and never runs
    #     on the default branch, so this arm is the ONLY Go validation main gets.
    #
    #   * pull_request, gated on govuln-allowlist — DELIBERATELY NARROW. The required
    #     run takes `scan-default-branch`'s default of false, so it will not scan a
    #     pull request that edits only a .govulncheck-allow.txt; this arm exists so a
    #     risk acceptance is validated by the scanner it applies to. Do NOT widen this
    #     to `code`: .govulncheck-allow.txt is already a member of the `code` filter,
    #     so `code` is a strict superset whose extra region is precisely where the
    #     required workflow already runs the identical nine jobs. Widening it buys no
    #     coverage and doubles the Go suite on every Go pull request.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.govuln-allowlist == 'true')
    uses: devantler-tech/actions/.github/workflows/validate-go-project.yaml@3ee6cb9bbd616c2a38779be41a5e41f3e77282d0 # v13.2.3
    # Both inputs make a default-branch run answer "did the check run" rather than
    # "did the diff touch a Go file". On main the branch's green IS the protection
    # signal, so a path filter that skips the suite or the scan leaves main green
    # over breakage it never looked at:
    #
    #   * scan-default-branch — an advisory published against already-merged code
    #     makes unchanged code vulnerable. A diff filter structurally cannot see
    #     that, so main stayed unscanned until someone happened to touch a Go file.
    #
    #   * test-default-branch — a Go test may read a non-Go file as its subject, so
    #     a commit touching only those files skips the suite while breaking it.
    #
    # Both ship default-false in the reusable workflow so consumers adopt them one
    # at a time; ksail is its only caller, so this completes the rollout and both
    # inputs can then be retired (devantler-tech/actions#788, ksail#6373).
    with:
      scan-default-branch: true
      test-default-branch: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
      code-quality: write
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Gate: wait for the org-wide Required Workflow "✅ Validate Go Project" to
  # finish before starting expensive system tests. On workflow_dispatch the
  # required workflow does not run, so this job is skipped.
  wait-for-validate-go:
    name: ⏳ Wait for Go Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.system-test == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      checks: read
    steps:
      - name: Wait for ✅ Validate Go Project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prefix = '✅ Validate Go Project';
            const maxWait = 25 * 60 * 1000; // 25 minutes
            const poll = 30 * 1000; // 30 seconds
            const start = Date.now();

            while (Date.now() - start < maxWait) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });

              const relevant = checks.check_runs.filter(cr =>
                cr.name.startsWith(prefix)
              );

              if (relevant.length > 0) {
                const pending = relevant.filter(cr => cr.status !== 'completed');
                if (pending.length === 0) {
                  const failed = relevant.filter(cr =>
                    !['success', 'skipped', 'neutral'].includes(cr.conclusion)
                  );
                  if (failed.length > 0) {
                    const names = failed.map(cr => `${cr.name}: ${cr.conclusion}`).join('\n');
                    core.setFailed(`Go validation failed:\n${names}`);
                    return;
                  }
                  core.info(`✅ All ${relevant.length} Go validation check(s) passed`);
                  return;
                }
                core.info(`⏳ Waiting for ${pending.length}/${relevant.length} check(s)...`);
              } else {
                core.info('⏳ No Go validation checks found yet...');
              }

              await new Promise(r => setTimeout(r, poll));
            }

            // On timeout, succeed gracefully if no checks ever appeared
            // (required workflow may not be configured for this repo).
            const { data: final } = await github.rest.checks.listForRef({
              owner, repo, ref: sha, per_page: 100,
            });
            const remaining = final.check_runs.filter(cr =>
              cr.name.startsWith(prefix)
            );
            if (remaining.length === 0) {
              core.warning('No Go validation checks found — required workflow may not apply to this repo');
              return;
            }
            core.setFailed('Timed out waiting for Go validation checks to complete');

  verify-go-archive:
    name: 🔐 Verify go-archive Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 📦 Verify release installer
        run: .github/scripts/install-release.test.sh

      - name: 🧪 Verify parity guard behavior
        run: .github/scripts/verify-go-archive-parity.test.sh

      - name: 🔐 Verify reviewed upstream bytes
        run: .github/scripts/verify-go-archive-parity.sh

  build-artifact:
    name: 🏗️ Build KSail Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.system-test == 'true'))
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # The KSail binary links the full embedded-CLI import graph into a large
        # binary; the Go linker can exhaust a stock runner's disk on a cache-miss
        # build ("no space left on device"). Reclaim space before building.
        uses: ./.github/actions/free-disk-space

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail

  generate:
    name: 📝 Generate Schema, CRD & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Depend on build-artifact so the Go build cache is warm by the time
    # `go generate ./docs/...` (and ./schemas/...) re-compiles the cli import
    # graph. On events where build-artifact is skipped (push to main), this
    # falls through and the job still runs.
    # Docs-content changes also trigger this job: the chat assistant docs
    # (pkg/svc/chat/docs_generated.go) are generated from docs/src/content/docs
    # and go stale on docs-only PRs otherwise.
    needs: [changes, build-artifact]
    if: >-
      !cancelled()
      && github.event_name != 'merge_group'
      && (needs.changes.outputs.schema == 'true'
        || needs.changes.outputs.cli == 'true'
        || needs.changes.outputs.docs == 'true')
      && (needs.build-artifact.result == 'success' || needs.build-artifact.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: 🧹 Free disk space
        # `go generate ./docs/...` re-links the full embedded-CLI import graph
        # (kubectl, helm, kind, k3d, vcluster, flux, argocd, eksctl, …) into a
        # large binary; on a stock ubuntu-latest runner the linker can exhaust
        # disk ("no space left on device"). Reclaim space before Go is set up.
        uses: ./.github/actions/free-disk-space

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📝 Generate JSON schema
        if: needs.changes.outputs.schema == 'true'
        run: go generate ./schemas/...

      - name: 📐 Generate CRD & DeepCopy
        if: needs.changes.outputs.schema == 'true'
        run: go generate ./pkg/apis/...

      - name: 📚 Generate reference documentation
        if: needs.changes.outputs.cli == 'true'
        run: go generate ./docs/...

      - name: 💬 Generate chat assistant docs
        # pkg/svc/chat/docs_generated.go embeds the docs content, so it goes
        # stale on BOTH docs-content changes and CLI changes (the reference
        # docs regenerated above feed into it; ordering matters). Unlike the
        # docs generator, gen_docs.go is a lightweight stdlib-only file reader
        # — it does not link the embedded-CLI graph, so it adds no disk-space
        # pressure to this job.
        if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.docs == 'true'
        run: go generate ./pkg/svc/chat/...

      - name: ⚙️ Setup Node.js
        if: needs.changes.outputs.schema == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/ui/package-lock.json"

      - name: 🧬 Generate web UI config types
        # The web UI build regenerates its types at build time (`npm run build`
        # runs gen:types), so the SHIPPED UI is always fresh — but the COMMITTED
        # web/ui/src/generated/ksail-config.ts is only ever updated by hand and
        # silently drifts when the JSON schema changes. Regenerate it here so
        # the patch/auto-commit machinery below diff-checks and fixes it.
        if: needs.changes.outputs.schema == 'true'
        run: |
          npm --prefix web/ui ci
          npm --prefix web/ui run gen:types

      - name: 📤 Upload patch
        run: |
          git add -N .
          git diff > /tmp/generate.patch
          if [ -s /tmp/generate.patch ]; then
            echo "Changes detected"
          else
            echo "No changes"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generate-patch
          path: /tmp/generate.patch
          if-no-files-found: ignore
          retention-days: 1

      - name: ❌ Fail if generated files are out of date (fork PR)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          if [ -s /tmp/generate.patch ]; then
            echo "::error::Generated files are out of date. Please run 'make generate' locally and commit the results."
            echo ""
            cat /tmp/generate.patch
            exit 1
          fi

  auto-commit:
    name: 📤 Auto-Commit Generated Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, generate, verify-desktop-tidy]
    if: >-
      always()
      && github.event_name != 'merge_group'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.generate.result == 'success' || needs.verify-desktop-tidy.result == 'success')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🔑 Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - GitHub App token generation, no environment scoping available for app installations

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: 📥 Download patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-patch"
          merge-multiple: true
          path: /tmp/patches

      - name: 📋 Apply patches
        run: |
          set -euo pipefail
          shopt -s nullglob

          for patch in /tmp/patches/*.patch; do
            if [ -s "$patch" ]; then
              patch_name="$(basename "$patch")"
              echo "Applying ${patch_name}..."

              if git apply --3way "$patch"; then
                echo "Applied ${patch_name} with 3-way merge."
              else
                echo "3-way apply failed for ${patch_name}; falling back to direct apply with rejects..." >&2

                if git apply --reject "$patch"; then
                  echo "Applied ${patch_name} with rejects."
                  rej_files=$(find . -name '*.rej' 2>/dev/null || true)
                  if [ -n "$rej_files" ]; then
                    echo "::error::Reject files found after applying ${patch_name}:"
                    echo "${rej_files}"
                    git status --short || true
                    echo "Failing job to avoid committing partially-applied patches." >&2
                    exit 1
                  fi
                else
                  echo "::error::Failed to apply patch ${patch_name}. See diagnostics above." >&2
                  git status --short || true
                  exit 1
                fi
              fi
            else
              echo "Skipping empty patch $(basename "$patch")"
            fi
          done

      # Commits through the GitHub API rather than the git CLI, because the repository
      # requires signed commits and API-created commits are signed by GitHub automatically.
      # A CLI commit here is unsigned and makes the pull request permanently unmergeable.
      #
      # Limitation: the API's FileAddition carries only a path and its contents, so file
      # modes are not expressible. Reject anything other than a regular 0644 file below
      # rather than dereferencing a symlink or silently losing an executable bit.
      - name: 📤 Commit and push generated changes (PR branch)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          additions="$workdir/additions.ndjson"
          deletions="$workdir/deletions.ndjson"
          : >"$additions"
          : >"$deletions"

          # Written to a file rather than read through process substitution: a process
          # substitution's exit status is invisible to both `set -e` and `pipefail`, so a
          # failing `git status` would otherwise look exactly like "nothing to commit" and
          # leave the branch silently stale with a green build.
          # -uall lists untracked files individually; without it git collapses a new
          # directory into a single "dir/" entry, which is not a file we can encode.
          git status --porcelain -z --no-renames -uall >"$workdir/status"

          while IFS= read -r -d '' entry; do
            entry_status="${entry:0:2}"
            entry_path="${entry:3}"
            [ -n "$entry_path" ] || continue
            case "$entry_status" in
              *D*)
                jq -n --arg p "$entry_path" '{path: $p}' >>"$deletions"
                ;;
              *)
                # FileAddition cannot represent symlinks, special files, or executable
                # modes. In particular, reading a symlink here would dereference it and
                # could publish sensitive runner files as an ordinary repository file.
                if [ -L "$entry_path" ] || [ ! -f "$entry_path" ] || [ -x "$entry_path" ]; then
                  echo "::error file=${entry_path}::Generated change is not a regular non-executable file"
                  exit 1
                fi
                # File content must never reach argv. Linux caps a single argv entry at
                # MAX_ARG_STRLEN (128 KiB) independently of ARG_MAX, and generated files
                # here run to hundreds of KiB (pkg/svc/chat/docs_generated.go alone is
                # ~0.5 MB, ~0.67 MB once base64-encoded). Passing it with --arg fails with
                # E2BIG on exactly the pull requests this step exists to serve. --rawfile
                # reads it from disk instead, and base64 output is ASCII so binary inputs
                # survive the round trip.
                base64 -w0 <"$entry_path" >"$workdir/content.b64"
                jq -n --arg p "$entry_path" --rawfile c "$workdir/content.b64" \
                  '{path: $p, contents: ($c | gsub("\\s"; ""))}' >>"$additions"
                ;;
            esac
          done <"$workdir/status"

          # The whole point of using the API is that the commit is signed, so prove it
          # rather than assuming it: an unsigned commit here blocks the pull request.
          verify_signed() {
            local sha="$1"
            local verified
            verified="$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.verification.verified')"
            if [ "$verified" != "true" ]; then
              echo "::error::Generated commit ${sha} is not signed (verified=${verified})."
              exit 1
            fi
            echo "Verified signature on ${sha}."
          }

          if [ ! -s "$additions" ] && [ ! -s "$deletions" ]; then
            echo "No generated changes to commit."
            # Committing below pushes to the PR branch, which raises `synchronize`. That new
            # run shares this workflow's concurrency group with cancel-in-progress, so it can
            # cancel the committing run before it verifies. The replacement run then lands
            # here, with the work already committed and nothing left to do — so verify the
            # head instead of exiting blind, or a signing regression escapes unreported and
            # silently re-creates the unmergeable-PR condition this step exists to prevent.
            if [ "$(git log -1 --format=%s)" = "chore: sync modules and update generated files" ]; then
              echo "Head is a generated commit; verifying it here in case the run that created it was cancelled."
              verify_signed "$(git rev-parse HEAD)"
            fi
            exit 0
          fi

          # --slurpfile keeps the aggregate off argv too: the combined payload is bounded
          # by total changed content, which routinely exceeds the same 128 KiB cap.
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$(git rev-parse HEAD)" \
            --slurpfile additions "$additions" \
            --slurpfile deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: { headline: "chore: sync modules and update generated files" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions, deletions: $deletions }
                }
              }
            }' >"$workdir/mutation.json"

          # `gh api graphql` exits non-zero on a GraphQL error, so the assignment itself
          # would abort under `set -e` and skip these diagnostics. Handle the failure
          # inline so the operator gets a labelled annotation instead of one stderr line.
          if ! response="$(gh api graphql --input "$workdir/mutation.json" 2>"$workdir/stderr")"; then
            echo "::error::createCommitOnBranch failed"
            cat "$workdir/stderr" >&2
            jq '.errors // .' <<<"$response" 2>/dev/null || printf '%s\n' "$response"
            exit 1
          fi
          # Capture first, then assert with a builtin. `jq -e` as the if-condition cannot
          # distinguish "the filter was false" (exit 1) from "jq itself failed" (exit 4 on
          # empty input, 5 on malformed), so a truncated or non-JSON response would take
          # the no-errors path and continue. Capturing instead puts jq's failure where
          # `set -e` catches it, so a bad response stops here rather than surfacing later
          # as an unrelated error against a commit id of "null".
          errors="$(jq -c '.errors // empty' <<<"$response")"
          if [ -n "$errors" ]; then
            echo "::error::createCommitOnBranch failed"
            printf '%s\n' "$errors"
            exit 1
          fi

          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"$response")"
          if [ -z "$oid" ]; then
            echo "::error::createCommitOnBranch returned no commit oid"
            printf '%s\n' "$response"
            exit 1
          fi
          echo "Committed generated changes as ${oid}."
          verify_signed "$oid"

      - name: 📤 Open PR for generated changes (protected branch)
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: sync modules and update generated files"
          committer: "generator-bot <generator-bot@users.noreply.github.com>"
          branch: chore/sync-generated-files/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore: sync modules and update generated files"
          body: |
            Auto-generated changes detected on `${{ github.ref_name }}`.
            This PR updates generated files (schemas, docs, etc.) that were
            not included in the originating commit.
          delete-branch: true

  home-isolation:
    name: 🏠 Home Isolation Guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 🏠 Verify tests never touch the real home directory
        shell: bash
        run: |
          set -euo pipefail

          # Preserve Go caches so redirecting $HOME does not trigger a cold
          # rebuild and so build/module artifacts land outside the sandbox.
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          GOPATH="$(go env GOPATH)"
          export GOCACHE GOMODCACHE GOPATH

          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          mkdir -p "$sandbox/.kube" "$sandbox/.ksail"
          cat > "$sandbox/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          current-context: admin@home-isolation-guard
          clusters:
            - cluster:
                server: https://localhost:6443
              name: home-isolation-guard
          contexts:
            - context:
                cluster: home-isolation-guard
                user: admin@home-isolation-guard
              name: admin@home-isolation-guard
          users:
            - name: admin@home-isolation-guard
          EOF
          printf '{"recent":["__home_isolation_guard__"]}' > "$sandbox/.ksail/switch-history.json"

          kube_before="$(sha256sum "$sandbox/.kube/config" | cut -d' ' -f1)"
          hist_before="$(sha256sum "$sandbox/.ksail/switch-history.json" | cut -d' ' -f1)"
          tree_before="$(find "$sandbox/.kube" "$sandbox/.ksail" | sort)"

          # Run the whole suite with $HOME redirected to the sandbox. Test
          # pass/fail is the main test workflow's job; this guard only asserts
          # that no test mutated the real home directory, so failures here are
          # tolerated.
          HOME="$sandbox" go test ./... >/dev/null 2>&1 || true

          # Capture the post-run state with errexit disabled: a test that
          # deletes the canary files/dirs is itself a violation, and the empty
          # captures below will differ from the "before" values and trip the
          # actionable ::error:: messages rather than aborting the step.
          set +e
          kube_after="$(sha256sum "$sandbox/.kube/config" 2>/dev/null | cut -d' ' -f1)"
          hist_after="$(sha256sum "$sandbox/.ksail/switch-history.json" 2>/dev/null | cut -d' ' -f1)"
          tree_after="$(find "$sandbox/.kube" "$sandbox/.ksail" 2>/dev/null | sort)"
          set -e

          status=0
          if [ "$kube_before" != "$kube_after" ]; then
            echo "::error::A test mutated \$HOME/.kube/config. Add a homeenv.Run/Isolate TestMain to the offending package (see internal/testutil/homeenv)."
            status=1
          fi
          if [ "$hist_before" != "$hist_after" ]; then
            echo "::error::A test mutated \$HOME/.ksail/switch-history.json. Add a homeenv.Run/Isolate TestMain to the offending package."
            status=1
          fi
          if [ "$tree_before" != "$tree_after" ]; then
            echo "::error::A test created or removed files under \$HOME/.kube or \$HOME/.ksail. Add a homeenv.Run/Isolate TestMain to the offending package."
            diff <(printf '%s\n' "$tree_before") <(printf '%s\n' "$tree_after") || true
            status=1
          fi
          exit "$status"

  audit-docs:
    name: 🔍 Audit Docs Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.docs-deps == 'true'
    permissions:
      contents: write
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 NPM Audit and Fix
        uses: ./.github/actions/npm-audit-and-fix
        with:
          working-directory: docs
          client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - GitHub App token generation, no environment scoping available for app installations
          commit-message: "chore(docs): fix npm audit vulnerabilities"

  audit-vsce:
    name: 🔍 Audit VSCode Extension Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.vsce-deps == 'true'
    permissions:
      contents: write
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 NPM Audit and Fix
        uses: ./.github/actions/npm-audit-and-fix
        with:
          working-directory: vsce
          client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - GitHub App token generation, no environment scoping available for app installations
          commit-message: "chore(vsce): fix npm audit vulnerabilities"

  build-docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: 📦 Install dependencies
        working-directory: docs
        run: npm ci

      - name: 🏗️ Build with Astro
        working-directory: docs
        run: npm run build

  vscode-extension:
    name: 🧩 VSCode Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.vsce == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vsce
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "vsce/package-lock.json"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Compile
        run: npm run compile

      - name: 📦 Package extension
        run: npm run package

      - name: 📦 Create VSIX package
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: npx @vscode/vsce package --out ksail.vsix

      - name: 📤 Upload VSIX artifact
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ksail-vsix
          path: ksail.vsix
          retention-days: 7

  copilot-plugin:
    name: 🧩 Copilot CLI Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.copilot-plugin == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Validate plugin manifests
        run: |
          set -euo pipefail
          for f in \
            copilot-plugin/plugin.json \
            copilot-plugin/.claude-plugin/plugin.json \
            copilot-plugin/.mcp.json \
            .github/plugin/marketplace.json \
            .claude-plugin/marketplace.json; do
            echo "Validating $f"
            jq -e . "$f" >/dev/null
          done

          # Required fields on the Copilot CLI + Claude Code plugin manifests
          for f in copilot-plugin/plugin.json copilot-plugin/.claude-plugin/plugin.json; do
            jq -e '.name == "ksail" and .version' "$f" >/dev/null
          done

          # Cross-file consistency: cd.yaml's version-bump script rewrites all four manifests
          # together, and the license once drifted between the two plugin.json copies
          # (GPL-3.0-only vs PolyForm-Shield-1.0.0). Assert version + license stay equal.
          for field in version license; do
            a="$(jq -r --arg k "$field" '.[$k]' copilot-plugin/plugin.json)"
            b="$(jq -r --arg k "$field" '.[$k]' copilot-plugin/.claude-plugin/plugin.json)"
            if [ "$a" != "$b" ]; then
              echo "::error::plugin.json '$field' drifted: copilot-plugin/plugin.json has '$a' but copilot-plugin/.claude-plugin/plugin.json has '$b'"
              exit 1
            fi
          done

          # Each marketplace must reference the plugin directory and carry the same version
          # (twice each: .metadata.version and .plugins[0].version) as the plugin manifests.
          version="$(jq -r '.version' copilot-plugin/plugin.json)"
          for f in .github/plugin/marketplace.json .claude-plugin/marketplace.json; do
            jq -e '.plugins[0].source == "./copilot-plugin" and .plugins[0].name == "ksail"' "$f" >/dev/null
            if ! jq -e --arg v "$version" '.metadata.version == $v and .plugins[0].version == $v' "$f" >/dev/null; then
              echo "::error::$f version drifted from copilot-plugin/plugin.json ('$version')"
              exit 1
            fi
          done

          # Skill manifest must exist
          test -f copilot-plugin/skills/ksail/SKILL.md

          # MCP server must point at the ksail binary
          jq -e '.mcpServers.ksail.command == "ksail"' copilot-plugin/.mcp.json >/dev/null

  operator-chart-lint:
    name: ⛵ Operator Chart Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.operator-chart == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Helm lint
        run: helm lint charts/ksail-operator

      - name: 📐 Helm template (value permutations)
        run: |
          set -euo pipefail
          echo "=== defaults (operator only) ==="
          helm template ksail-operator charts/ksail-operator >/dev/null
          echo "=== ui.ingress.enabled ==="
          helm template ksail-operator charts/ksail-operator \
            --set ui.ingress.enabled=true >/dev/null
          echo "=== auth.oidc.enabled ==="
          # OIDC requires a redirectURL (or ui.ingress) plus a client secret;
          # the operator does not run here, so dummy values are sufficient to
          # exercise the secret/deployment templates.
          helm template ksail-operator charts/ksail-operator \
            --set ui.ingress.enabled=true \
            --set auth.oidc.enabled=true \
            --set auth.oidc.issuerURL=https://dex.example \
            --set auth.oidc.clientID=ksail \
            --set auth.oidc.clientSecret=dummy \
            --set auth.oidc.redirectURL=https://ksail.local/api/v1/auth/callback >/dev/null
          echo "✅ All chart template permutations rendered"

  operator-chart-e2e:
    name: ⛵ Operator Chart E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    # Local images only — no secrets/GHCR — so this also runs on fork PRs.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && needs.changes.outputs.operator-chart == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # E2E builds the operator image and spins up a Kubernetes cluster in
        # Docker — reclaim disk first to avoid runner "no space left on device".
        uses: ./.github/actions/free-disk-space
        with:
          docker-prune: "true"

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 🧪 Run Operator Chart E2E
        uses: ./.github/actions/operator-chart-e2e

  warm-helm-cache:
    name: 🔥 Warm Helm Cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-artifact, wait-for-validate-go]
    if: >-
      !cancelled()
      && (needs.wait-for-validate-go.result == 'success' || needs.wait-for-validate-go.result == 'skipped')
      && (
        (github.event_name == 'pull_request'
        && needs.changes.outputs.system-test == 'true'
        && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && inputs.run_system_tests == true)
      )
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.warm.outputs.cache-key }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Builds the ksail binary on a cache miss and pulls Helm charts —
        # reclaim disk first to avoid runner "no space left on device".
        uses: ./.github/actions/free-disk-space

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 🔥 Warm Helm chart cache
        id: warm
        uses: ./.github/actions/warm-helm-cache

  warm-mirror-cache:
    name: 🔥 Warm Mirror Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build-artifact, wait-for-validate-go]
    if: >-
      !cancelled()
      && (needs.wait-for-validate-go.result == 'success' || needs.wait-for-validate-go.result == 'skipped')
      && (
        (github.event_name == 'pull_request'
        && needs.changes.outputs.system-test == 'true'
        && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && inputs.run_system_tests == true)
      )
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.warm.outputs.cache-key }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Pulls every system-test image through four mirror registries and tars
        # the volumes (multi-GB) — the prime "no space left on device" offender
        # (e.g. run 27774791970). Reclaim disk before warming the cache.
        uses: ./.github/actions/free-disk-space

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 🔥 Warm mirror cache
        id: warm
        uses: ./.github/actions/warm-mirror-cache

  # Docker-based system tests run in full parallelism with no concurrency
  # constraints — each job gets its own runner with local Docker containers.
  system-test-docker:
    name: 🧪 System Test (Docker)
    runs-on: ubuntu-latest
    # The Talos host + full nested Kubernetes-provider coverage (Vanilla,K3s,VCluster,Talos)
    # has a ~77-min worst case. 120 gives comfortable headroom to absorb runtime variance
    # without trimming test coverage.
    timeout-minutes: 120
    needs:
      [
        changes,
        build-artifact,
        warm-helm-cache,
        warm-mirror-cache,
        wait-for-validate-go,
      ]
    if: >-
      !cancelled()
      && (needs.wait-for-validate-go.result == 'success' || needs.wait-for-validate-go.result == 'skipped')
      && (
        (github.event_name == 'pull_request'
        && needs.changes.outputs.system-test == 'true'
        && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && inputs.run_system_tests == true)
      )
    permissions:
      contents: read
      packages: write
    strategy:
      # fail-fast: false so a single failing leg does not cancel its siblings. This surfaces
      # every failing distribution/arg combination in one run (aligning with the goal of
      # making all CI errors visible and blocking) instead of masking later legs behind the
      # first failure, and it lets the diagnostic-bearing legs run to completion.
      fail-fast: false
      max-parallel: 15
      matrix:
        distribution: [KWOK, Vanilla, K3s, VCluster, Talos]
        provider: [Docker]
        init: [true]
        args:
          - ""
          - "--name system-test-cluster --cni Cilium --csi Enabled --load-balancer Enabled --metrics-server Enabled --policy-engine Kyverno --cert-manager Enabled --gitops-engine Flux"
          - "--cni Calico --csi Disabled --load-balancer Disabled --metrics-server Disabled --policy-engine Gatekeeper --gitops-engine ArgoCD"
          - "--gitops-engine Flux --local-registry ghcr.io/devantler-tech/ksail/system-test-manifests"
          - "--gitops-engine ArgoCD --local-registry ghcr.io/devantler-tech/ksail/system-test-manifests"
        # init=false (CLI-flag-only path without ksail.yaml) is now covered by
        # unit tests (TestCreate_NoConfigFile_*) instead of full E2E clusters.
        include:
          - distribution: Talos
            provider: Docker
            init: true
            args: "--name system-test-cluster-with-image-verification --image-verification Enabled"
          # Enable Kubernetes provider tests on the default (init=true, args="")
          # entry for each distribution. This tests all 4 nested distributions
          # (Vanilla,K3s,VCluster,Talos) on each host type, once per matrix.
          # The three mirror-supported distributions also opt into their smoke
          # test here so it runs once per distribution rather than for all args.
          - distribution: Vanilla
            provider: Docker
            init: true
            args: ""
            test-kubernetes-provider: "true"
            test-workload-mirror: "true"
          - distribution: K3s
            provider: Docker
            init: true
            args: ""
            test-kubernetes-provider: "true"
            test-workload-mirror: "true"
          - distribution: Talos
            provider: Docker
            init: true
            args: ""
            test-kubernetes-provider: "true"
          - distribution: VCluster
            provider: Docker
            init: true
            args: ""
            test-kubernetes-provider: "true"
            test-workload-mirror: "true"
          # Validate Calico on the Kubernetes (k3k) provider. Calico v3.30+'s CRD
          # chart ships MutatingAdmissionPolicy resources that need the v1beta1
          # admissionregistration API enabled on the embedded k3s server via the k3k
          # Cluster serverArgs. The default test-kubernetes-provider legs above use
          # the distribution-default CNI, so this leg is the only one exercising the
          # k3k+Calico serverArgs path. A unique host args value keeps this as a
          # standalone matrix combination (not merged into the args="" Vanilla leg).
          - distribution: Vanilla
            provider: Docker
            init: true
            args: "--name k3k-calico-host"
            test-kubernetes-provider: "true"
            kubernetes-provider-distributions: "K3s"
            kubernetes-provider-cni: "Calico"
          # NOTE: KWOK excluded — simulated nodes cannot run real workloads (DinD pods)
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Reclaim ~30 GB before pulling system-test images and spinning up
        # clusters in Docker; docker-prune also clears the Docker daemon.
        uses: ./.github/actions/free-disk-space
        with:
          docker-prune: "true"

      - name: 🔐 Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env] - third-party action input, no environment scoping available

      - name: ⚙️ Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 📦 Cache KSail Binary
        uses: ./.github/actions/cache-ksail-binary
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
          source-hash: ${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          output-path: /usr/local/bin/ksail
          save: "false"

      - name: 📥 Restore Helm Cache
        uses: ./.github/actions/restore-helm-cache

      - name: 📥 Restore Mirror Cache
        uses: ./.github/actions/restore-mirror-cache

      - name: 🧪 Run KSail System Test
        id: system-test
        uses: ./.github/actions/ksail-system-test
        with:
          distribution: ${{ matrix.distribution }}
          provider: ${{ matrix.provider }}
          init: ${{ matrix.init }}
          args: ${{ matrix.args }}
          apply-overlay-path: ".github/fixtures/podinfo-overlay"
          test-kubernetes-provider: ${{ matrix.test-kubernetes-provider || 'false' }}
          test-workload-mirror: ${{ matrix.test-workload-mirror || 'false' }}
          kubernetes-provider-distributions: ${{ matrix.kubernetes-provider-distributions || 'Vanilla,K3s,VCluster,Talos' }}
          kubernetes-provider-cni: ${{ matrix.kubernetes-provider-cni || '' }}

          ghcr-user: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          # Composite-action steps cannot set timeout-minutes. Upload from the
          # workflow instead so a stalled artifact service is hard-bounded.
          # Defer cleanup until the failure diagnostics have been uploaded.
          upload-artifacts: "false"
          cleanup: "false"
          # A reserved K3s pod sandbox can wedge every API-backed command in the
          # rich debug action. Keep its essential diagnostics on bounded calls.
          comprehensive-debug: ${{ matrix.distribution == 'K3s' && 'false' || 'true' }}

      - name: 📤 Upload system test diagnostics
        if: ${{ failure() && steps.system-test.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-test-diagnostics-${{ steps.system-test.outputs.artifact-tag }}
          path: /tmp/system-test-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧪 Cleanup KSail System Test
        if: ${{ always() && steps.system-test.outcome != 'skipped' && steps.system-test.outcome != '' }}
        uses: ./.github/actions/ksail-system-test-cleanup
        with:
          distribution: ${{ matrix.distribution }}
          provider: ${{ matrix.provider }}
          args: ${{ matrix.args }}

      - name: 📤 Upload system test logs
        if: ${{ always() && steps.system-test.outcome != 'skipped' && steps.system-test.outcome != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-test-logs-${{ steps.system-test.outputs.artifact-tag }}
          path: /tmp/ksail-system-test-logs/
          retention-days: 7
          if-no-files-found: ignore

  verify-desktop-tidy:
    name: 🧩 Verify Desktop Module Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The desktop app is a SEPARATE Go module that vendors the main module via `replace => ../`, so
      # its go.{mod,sum} must independently track the main module's dependency graph. A root dependency
      # bump (e.g. a dependabot gomod PR) touches only the root go.{mod,sum} and leaves desktop stale,
      # which would break the release-time desktop build with a cryptic "updates to go.mod needed".
      # Rather than hard-fail and force a manual `go -C desktop mod tidy`, self-heal the same way
      # generated files are synced: run tidy, capture the diff as a patch artifact, and let the
      # 📤 Auto-Commit Generated Changes job apply it to the PR branch. Fork PRs — which that job cannot
      # push to — still hard-fail with actionable guidance.
      - name: 🧹 Tidy desktop module
        working-directory: desktop
        run: go mod tidy

      - name: 📤 Upload patch
        run: |
          git add -N .
          git diff > /tmp/desktop-tidy.patch
          if [ -s /tmp/desktop-tidy.patch ]; then
            echo "Desktop module drift detected; patch will be auto-committed on same-repo PRs."
          else
            echo "Desktop module already tidy."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-tidy-patch
          path: /tmp/desktop-tidy.patch
          if-no-files-found: ignore
          retention-days: 1

      - name: ❌ Fail if desktop module is out of date (fork PR)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          if [ -s /tmp/desktop-tidy.patch ]; then
            echo "::error::desktop/go.{mod,sum} are out of date. Please run 'go -C desktop mod tidy' locally and commit the result."
            echo ""
            cat /tmp/desktop-tidy.patch
            exit 1
          fi

  validate-calico-chart:
    name: 🔍 Validate Calico Chart Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Cheap pre-flight: a calico/node image bump (Dependabot updates the
    # Dockerfile) can outpace the tigera-operator chart release, so the chart
    # version version.go derives from the tag points at a chart that is not
    # published. Without this, the bad pin only surfaces after the full ~30-min
    # System Test matrix as an opaque "Calico not detected". Fail fast and
    # legibly instead. See https://github.com/devantler-tech/ksail/issues/5463.
    if: needs.changes.outputs.calico-cni == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Verify the derived tigera-operator chart version is published
        run: |
          set -euo pipefail
          dockerfile="pkg/svc/installer/cni/calico/Dockerfile"
          # Mirror version.go's chartVersion(): the chart version is the
          # calico/node image tag (FROM docker.io/calico/node:<tag>@sha256:…).
          version="$(sed -nE 's|.*docker\.io/calico/node:([^@[:space:]]+).*|\1|p' "$dockerfile" | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=$dockerfile::Could not derive the calico/node tag from $dockerfile — has the FROM line format changed? Update this guard and version.go together."
            exit 1
          fi
          echo "Derived Calico chart version: $version"

          repo_url="https://docs.tigera.io/calico/charts"
          helm repo add projectcalico "$repo_url" >/dev/null
          helm repo update projectcalico >/dev/null

          # The installer installs BOTH the operator chart and the CRD chart at
          # this version (installer.go chartSpec/crdChartSpec); a bump that
          # outpaces either chart leaves the install unresolvable.
          status=0
          for chart in tigera-operator projectcalico.org.v3; do
            if helm show chart "projectcalico/$chart" --version "$version" >/dev/null 2>&1; then
              echo "✅ projectcalico/$chart $version is published"
            else
              echo "::error file=$dockerfile::projectcalico/$chart has no published $version chart. The calico/node image tag was bumped ahead of the tigera-operator chart release — pin $dockerfile to a calico/node tag whose matching chart is published at $repo_url (the calico/node tag must equal the chart version)."
              status=1
            fi
          done
          exit "$status"

  verify-dependency-test-graph:
    name: 🔗 Verify Dependency Test Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.dependency-test-graph == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # `go build ./...` and `go test ./...` resolve only THIS module's packages and their own
      # tests. Neither resolves the tests of a DEPENDENCY, so a dependency whose test imports a
      # package no module in the graph provides leaves every repo check green. Dependabot does
      # resolve that wider graph on each update, so the break surfaces only as an aborted update
      # in the Dependabot logs — invisible unless someone goes looking (ksail#6666: four straight
      # days of failed root go_modules updates while CI was green throughout).
      #
      # sops/v3/hcvault.test is the concrete chain that broke, via
      # dockertest/v3 -> docker/pkg/idtools -> opencontainers/runc/libcontainer/user.
      # Resolving it here turns a silent Dependabot abort into a failing check on the PR that
      # introduces it.
      - name: 🔗 Resolve dependency test graph
        run: |
          if ! out="$(go list -deps -test github.com/getsops/sops/v3/hcvault 2>&1 >/dev/null)"; then
            echo "::error::A dependency's test graph no longer resolves, so Dependabot cannot update root Go modules."
            printf '%s\n' "$out"
            echo "Fix: keep a module that still provides the missing package in the graph."
            echo "Because MVS selects the MAXIMUM version, a 'require' is only a floor — use a 'replace'."
            exit 1
          fi
          echo "Dependency test graph resolves."

  verify-todos-workflow-contract:
    name: 🧾 Verify TODO Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'merge_group' && needs.changes.outputs.todos-contract == 'true'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # -count=1 is load-bearing: this test's real subject is a YAML file the Go build graph
      # cannot see, so a cached PASS from an earlier run would be replayed over a changed
      # workflow and report success without executing anything.
      - name: 🧾 Verify TODO workflow contract
        run: |
          if ! go test ./internal/ciharness/... -count=1; then
            echo "::error::The TODO scanner workflow no longer matches the contract in internal/ciharness."
            echo "Fix: reconcile .github/workflows/todos.yaml with the assertions, or update the assertions if the contract itself changed."
            exit 1
          fi

  require-checks-in-pr:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        rate-limit-gate,
        changes,
        ci-go,
        wait-for-validate-go,
        verify-go-archive,
        build-artifact,
        generate,
        auto-commit,
        warm-helm-cache,
        warm-mirror-cache,
        system-test-docker,
        home-isolation,
        audit-docs,
        audit-vsce,
        build-docs,
        vscode-extension,
        copilot-plugin,
        operator-chart-lint,
        operator-chart-e2e,
        verify-desktop-tidy,
        validate-calico-chart,
        verify-dependency-test-graph,
        verify-todos-workflow-contract,
        cask-pr-handoff,
      ]
    if: ${{ always() }}
    steps:
      - uses: devantler-tech/actions/aggregate-job-checks@3ee6cb9bbd616c2a38779be41a5e41f3e77282d0 # v13.2.3
        with:
          job-results: >-
            ${{ needs.rate-limit-gate.result }}
            ${{ needs.changes.result }}
            ${{ needs.ci-go.result }}
            ${{ needs.wait-for-validate-go.result }}
            ${{ needs.verify-go-archive.result }}
            ${{ needs.build-artifact.result }}
            ${{ needs.generate.result }}
            ${{ needs.auto-commit.result }}
            ${{ needs.warm-helm-cache.result }}
            ${{ needs.warm-mirror-cache.result }}
            ${{ needs.system-test-docker.result }}
