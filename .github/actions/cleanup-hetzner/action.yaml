name: Cleanup Hetzner Resources
description: |
  Deletes Hetzner Cloud resources matching the given label selector to ensure
  clean slate for next CI run, even if individual test jobs fail to clean up
  after themselves.

inputs:
  label-selector:
    description: Label selector for resources to delete
    required: true

runs:
  using: composite
  steps:
    - name: 📦 Setup hcloud CLI
      uses: hetznercloud/setup-hcloud@4ff9bbeda4053fb69dd7fa1fcbdfcce7e648bf33 # v1

    - name: 🧹 Cleanup all KSail-owned Hetzner resources
      shell: bash
      env:
        LABEL_SELECTOR: ${{ inputs.label-selector }}
      run: bash "$GITHUB_ACTION_PATH/cleanup-hetzner.sh"
