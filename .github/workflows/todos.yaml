name: "TODOs"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)

jobs:
  todos:
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@0e02148c251bcd65cfddc1cc7bec49ccce2eea42 # v22.7.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
