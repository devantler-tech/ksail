name: KSail Test Kubernetes Provider
description: |
  Tests the Kubernetes provider by creating nested clusters (4 distributions:
  Vanilla, K3s, VCluster, Talos) on top of the currently active host cluster.
  Each nested cluster is created, verified via `ksail cluster info`, and then deleted.

  Prerequisites:
  - A healthy host cluster must already be active (reachable via current kubeconfig context)
  - `ksail` binary must be in PATH

inputs:
  distributions:
    description: |
      Comma-separated list of distributions to test on the Kubernetes provider.
      Each will be created, verified, and deleted sequentially.
    required: false
    default: "Vanilla,K3s,VCluster,Talos"
  timeout:
    description: Timeout per nested cluster create (seconds)
    required: false
    # 1200s (20m): the shell wrapper must stay ABOVE the provisioner's internal Go
    # readiness deadline (ready-timeout, default 15m) so a slow-but-healthy nested
    # cluster surfaces a clean Go "context deadline exceeded" rather than a shell
    # "exit 124", and so nested Talos (Talos-in-pod inside a vCluster/Docker host —
    # the heaviest combination, which intermittently exceeded the old 600s under CI
    # load) keeps headroom. Headroom over trimming coverage — see #4891, the matrix
    # in ci.yaml, and the docs note on not reducing nested-distro coverage for flakes.
    default: "1200"
  ready-timeout:
    description: |
      Go duration budget for a nested cluster to report ready (k3k "poll cluster
      ready" / vCluster "wait for kubeconfig secret"). Exported as
      KSAIL_NESTED_READY_TIMEOUT so a slow-but-healthy nested cluster under runner
      contention is not failed prematurely at the 10m default (#4891). Keep the
      `timeout` input above this value so the Go deadline wins over the shell kill.
    required: false
    default: "15m"
  cni:
    description: |
      Optional CNI to install in each nested cluster (e.g. "Calico"). When empty,
      the distribution default is used. Calico exercises the k3k serverArgs path
      that enables the MutatingAdmissionPolicy / v1beta1 admissionregistration API.
    required: false
    default: ""
  assert-k3k-server-creator:
    description: |
      After each successful nested K3s (k3k) create, assert that the k3k server pod
      is owned by a StatefulSet and written by kube-controller-manager, and record
      that evidence in the kubernetes-provider log directory. The k3k privileged-pod
      guard pins exactly that principal with FailurePolicy Fail, so a k3k release that
      changed who creates the pod would make every k3k cluster unprovisionable; this
      keeps the premise asserted by CI rather than by a comment. A failed assertion
      counts as a failed distribution. Off by default.
    required: false
    default: "false"
  dockerhub-user:
    description: Docker Hub username for authenticated nested pull-through mirrors.
    required: false
    default: ""
  dockerhub-token:
    description: Docker Hub token/password for authenticated nested pull-through mirrors.
    required: false
    default: ""
  ghcr-user:
    description: GHCR username for authenticated nested pull-through mirrors.
    required: false
    default: ""
  ghcr-token:
    description: GHCR token for authenticated nested pull-through mirrors.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 🧪 Test Kubernetes Provider (nested clusters)
      shell: bash
      env:
        DISTRIBUTIONS: ${{ inputs.distributions }}
        TIMEOUT: ${{ inputs.timeout }}
        # Override the provisioner's internal readiness deadline (k3k poll-cluster-ready
        # / vCluster kubeconfig-secret wait) so a slow-but-healthy nested cluster under
        # runner contention is not failed prematurely at the 10m default. See #4891.
        KSAIL_NESTED_READY_TIMEOUT: ${{ inputs.ready-timeout }}
        CNI: ${{ inputs.cni }}
        ASSERT_K3K_SERVER_CREATOR: ${{ inputs.assert-k3k-server-creator }}
        # Mirror proxy credentials. Exported here so ksail expands the ${...}
        # placeholders in the --mirror-registry specs from its own process env,
        # keeping the secret values out of argv and the command log.
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-user }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
        GHCR_USERNAME: ${{ inputs.ghcr-user }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        # Opt into nested-cluster diagnostics: on a nested bootstrap failure, ksail
        # dumps the cluster's DinD node + mirror container logs to help diagnose
        # stalled image pulls. Off by default; enabled here for CI triage.
        KSAIL_NESTED_DEBUG: "1"
      run: |
        set -euo pipefail
        LOG_DIR="/tmp/ksail-system-test-logs/kubernetes-provider"
        mkdir -p "$LOG_DIR"

        echo "=== Kubernetes Provider E2E Tests ==="
        HOST_CONTEXT="$(kubectl config current-context)"
        echo "Host cluster context: $HOST_CONTEXT"
        echo "Distributions to test: $DISTRIBUTIONS"
        echo ""

        # Build authenticated pull-through mirror specs for the nested clusters.
        # The host-level mirror cache is invisible to the DinD daemon, so nested
        # clusters set up their own mirrors inside DinD. Authentication (vs. the
        # anonymous defaults) is what lifts the upstream rate limits that stall
        # the nested kubelet under CI concurrency. Credentials are passed as
        # ${ENV} placeholders that ksail expands internally; we only attach them
        # when BOTH halves are present, so the partial-credentials guard never
        # trips (e.g. forks without secrets fall back to anonymous mirrors).
        MIRRORS=()
        if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
          MIRRORS+=('${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}@docker.io=https://registry-1.docker.io')
        else
          MIRRORS+=('docker.io=https://registry-1.docker.io')
        fi
        if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
          MIRRORS+=('${GHCR_USERNAME}:${GHCR_TOKEN}@ghcr.io=https://ghcr.io')
        else
          MIRRORS+=('ghcr.io=https://ghcr.io')
        fi
        MIRRORS+=('quay.io=https://quay.io' 'registry.k8s.io=https://registry.k8s.io' 'ecr-public.aws.com=https://ecr-public.aws.com')
        MIRROR_ARG="$(IFS=,; printf '%s' "${MIRRORS[*]}")"
        echo "Nested mirror registries: ${#MIRRORS[@]} (docker.io/ghcr.io authenticated when secrets present)"
        echo ""

        FAILED=0
        PASSED=0
        IFS=',' read -ra DIST_ARRAY <<< "$DISTRIBUTIONS"

        for DIST in "${DIST_ARRAY[@]}"; do
          DIST=$(echo "$DIST" | xargs) # trim whitespace
          NESTED_NAME="nested-${DIST,,}"  # lowercase
          case "${DIST,,}" in
            vanilla) NESTED_CONTEXT="kind-$NESTED_NAME" ;;
            k3s) NESTED_CONTEXT="k3k-$NESTED_NAME" ;;
            vcluster) NESTED_CONTEXT="vcluster-$NESTED_NAME" ;;
            talos) NESTED_CONTEXT="admin@$NESTED_NAME" ;;
            kwok) NESTED_CONTEXT="kwok-$NESTED_NAME" ;;
            *) echo "❌ Unsupported nested distribution: $DIST"; exit 64 ;;
          esac
          echo "──────────────────────────────────────────────────────"
          echo "🧪 Testing: $DIST on Kubernetes provider (name: $NESTED_NAME)"
          echo "──────────────────────────────────────────────────────"

          CREATE_LOG="$LOG_DIR/${DIST,,}-create.log"
          INFO_LOG="$LOG_DIR/${DIST,,}-info.log"
          DELETE_LOG="$LOG_DIR/${DIST,,}-delete.log"

          # Create nested cluster
          echo "  ⏳ Creating $DIST cluster..."
          CREATE_ARGS=(--distribution "$DIST" --provider Kubernetes --name "$NESTED_NAME")
          if [ -n "$CNI" ]; then
            CREATE_ARGS+=(--cni "$CNI")
            echo "  ↳ using CNI: $CNI"
          fi
          create_ok=false
          if timeout "$TIMEOUT" ksail cluster create \
            "${CREATE_ARGS[@]}" \
            --mirror-registry "$MIRROR_ARG" \
            2>&1 | tee "$CREATE_LOG"; then
            create_ok=true
            echo "  ✅ $DIST create succeeded"
          else
            echo "  ❌ $DIST create FAILED (exit code: $?)"
            FAILED=$((FAILED + 1))
          fi

          # Probe the saved endpoint first. Info can hang on an unreachable API,
          # hiding the useful network/TLS error before cleanup removes its evidence.
          # A healthy host must never satisfy this nested-cluster readiness read.
          if [ "$create_ok" = "true" ]; then
            echo "  ⏳ Verifying $DIST nested API readiness..."
            # A nested API can answer not-ready for a moment after create returns.
            # Poll until an overall deadline and judge the last answer, so one
            # early failure does not delete a cluster that was about to be ready.
            nested_ready=false
            ready_deadline=$((SECONDS + 60))
            while true; do
              if NESTED_READY=$(timeout --kill-after=1s 20s kubectl --context "$NESTED_CONTEXT" get --raw=/readyz --request-timeout=15s) && [ "$NESTED_READY" = ok ]; then
                nested_ready=true
                break
              fi
              if [ "$SECONDS" -ge "$ready_deadline" ]; then
                break
              fi
              sleep 5
            done
            if [ "$nested_ready" = "true" ]; then
              echo "  ⏳ Verifying $DIST cluster info..."
              if timeout --kill-after=1s 30s ksail cluster info --name "$NESTED_NAME" --provider Kubernetes 2>&1 | tee "$INFO_LOG"; then
                echo "  ✅ $DIST info and nested API readiness succeeded"
                PASSED=$((PASSED + 1))
              else
                echo "  ❌ $DIST info FAILED"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "  ❌ $DIST nested API readiness FAILED"
              FAILED=$((FAILED + 1))
              if [ "${DIST,,}" = talos ]; then
                # Capture only this failed cluster's endpoint/port evidence before
                # deletion. Never dump kubeconfig, Secret data, or container env.
                {
                  timeout --kill-after=1s 10s kubectl --context "$HOST_CONTEXT" -n "ksail-$NESTED_NAME" \
                    get service apiserver --request-timeout=5s \
                    -o 'custom-columns=NAME:.metadata.name,PORT:.spec.ports[*].port,TARGET:.spec.ports[*].targetPort,NODEPORT:.spec.ports[*].nodePort' \
                    || echo 'Nested Service evidence unavailable'
                  timeout --kill-after=1s 10s kubectl --context "$HOST_CONTEXT" -n "ksail-$NESTED_NAME" \
                    get endpointslices -l kubernetes.io/service-name=apiserver --request-timeout=5s \
                    -o 'custom-columns=NAME:.metadata.name,ADDRESS:.endpoints[*].addresses[*],READY:.endpoints[*].conditions.ready,PORT:.ports[*].port' \
                    || echo 'Nested EndpointSlice evidence unavailable'
                  timeout --kill-after=1s 10s kubectl --context "$HOST_CONTEXT" -n "ksail-$NESTED_NAME" \
                    exec dind -c dind -- docker inspect --type container \
                    --format '{{json .NetworkSettings.Ports}}' "$NESTED_NAME-control-plane-1" \
                    || echo 'Nested port-binding evidence unavailable'
                } 2>&1 | tee "$LOG_DIR/${DIST,,}-endpoint.log" || echo 'Endpoint evidence could not be recorded'
              fi
            fi
          fi

          # Pin the premise the k3k privileged-pod guard depends on: the server pod is
          # created by the StatefulSet controller. Runs while the nested cluster is still
          # up, and a failure adds to FAILED rather than masking an earlier one.
          if [ "$create_ok" = "true" ] && [ "$ASSERT_K3K_SERVER_CREATOR" = "true" ] && [ "${DIST,,}" = "k3s" ]; then
            # An explicit host context can leave the nested cluster selected after
            # creation. The server pod lives on the host, so bind the query first.
            if kubectl config use-context "$HOST_CONTEXT"; then
              echo "  ⏳ Asserting the k3k server pod creating principal..."
              CREATOR_LOG="$LOG_DIR/${DIST,,}-server-creator.log"
              if "$GITHUB_WORKSPACE/.github/scripts/assert-k3k-server-creator.sh" "$NESTED_NAME" "$LOG_DIR" 2>&1 | tee "$CREATOR_LOG"; then
                echo "  ✅ $DIST server pod creator matches the guard pinned principal"
              else
                echo "  ❌ $DIST server pod creator assertion FAILED"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "  ❌ $DIST host context restoration FAILED; skipping server pod creator assertion"
              FAILED=$((FAILED + 1))
            fi
          fi

          # Always attempt delete (cleanup)
          echo "  ⏳ Deleting $DIST cluster..."
          if ksail cluster delete \
            --provider Kubernetes \
            --name "$NESTED_NAME" \
            --force \
            2>&1 | tee "$DELETE_LOG"; then
            echo "  ✅ $DIST delete succeeded"
          else
            echo "  ❌ $DIST delete FAILED"
            FAILED=$((FAILED + 1))
          fi

          # Restore host context in case nested cluster creation changed it.
          if ! kubectl config use-context "$HOST_CONTEXT"; then
            echo "  ❌ $DIST host context restoration FAILED; stopping nested tests"
            FAILED=$((FAILED + 1))
            break
          fi

          # Deletion is asynchronous. Verify the exact cluster namespaces on the
          # original host before starting another create; failures or a timeout
          # leave cleanup unverified and must never pass the provider trial.
          echo "  ⏳ Waiting for $DIST resources to drain..."
          SETTLE_DEADLINE=$((SECONDS + 120))
          drained=false
          while [ "$SECONDS" -lt "$SETTLE_DEADLINE" ]; do
            remaining_seconds=$((SETTLE_DEADLINE - SECONDS))
            if [ "$remaining_seconds" -le 0 ]; then
              break
            fi
            if ! remaining=$(timeout "${remaining_seconds}s" kubectl --context "$HOST_CONTEXT" get namespace \
              "ksail-$NESTED_NAME" "k3k-$NESTED_NAME" "vcluster-$NESTED_NAME" \
              --ignore-not-found -o name --request-timeout=15s); then
              echo "  ❌ $DIST namespace verification FAILED"
              break
            fi
            if [ -z "$remaining" ]; then
              drained=true
              echo "  ✅ $DIST resources drained"
              break
            fi
            sleep 5
          done
          if [ "$drained" != true ]; then
            echo "  ❌ $DIST cleanup was not verified; stopping nested tests"
            FAILED=$((FAILED + 1))
            break
          fi

          echo ""
        done

        echo "=== Kubernetes Provider Test Summary ==="
        echo "  Passed: $PASSED / ${#DIST_ARRAY[@]}"
        echo "  Failed: $FAILED / ${#DIST_ARRAY[@]}"

        if [ "$FAILED" -gt 0 ]; then
          echo "❌ $FAILED Kubernetes provider test(s) failed"
          exit 1
        fi
        echo "✅ All Kubernetes provider tests passed"
