name: Maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily bounded workflow-run cleanup
    - cron: "15 0 1 * *" # Monthly package cleanup

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
  # Keep a pending run instead of replacing it, so the daily and monthly
  # cleanups cannot silently drop each other.
  queue: max

permissions:
  contents: read

jobs:
  delete-old-workflow-runs:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/delete-old-workflow-runs.sh \
            --repository "${{ github.repository }}" \
            --retain-days 30 \
            --keep-minimum-runs 6 \
            --max-deletions 750

  # The link checker accepts a 502/503/504 so a momentary outage cannot fail an
  # unrelated PR (see lychee.toml). This job keeps a real outage of our own docs
  # site visible: it retries six times, 30 seconds apart (up to about 3.5 minutes,
  # or longer when attempts time out), so only an outage that outlasts the
  # retries fails the run. The 10-minute job timeout bounds the worst case.
  check-docs-site-availability:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check the docs site responds
        run: |
          curl --fail --silent --show-error --location \
            --output /dev/null \
            --max-time 30 \
            --retry 6 --retry-delay 30 --retry-all-errors \
            https://ksail.devantler.tech/

  # The pull-request link check reports a link that times out without failing (see
  # lychee.toml), because a time-out there usually means the host did not answer the
  # runner in time. This job is where a time-out still fails: it checks the same files
  # once a day with time-outs counted as errors, so a host that has stopped answering
  # for good turns this scheduled run red within a day instead of passing forever.
  check-external-links-strict:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the files the link checker reads
        run: .github/scripts/list-link-check-files.sh > "$RUNNER_TEMP/link-check-files.txt"

      - name: Check links with time-outs counted as errors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress --config lychee.toml --accept-timeouts=false
            --files-from ${{ runner.temp }}/link-check-files.txt
          fail: true

  delete-old-images:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '15 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: "ksail/system-test-manifests"
          package-type: "container"
          min-versions-to-keep: 100
