name: 🔍 CodeQL

# Advanced CodeQL setup. It replaces CodeQL default setup, and the two are mutually
# exclusive: default setup must be disabled in the repository settings
# (Settings → Code security → CodeQL analysis) for these results to upload.
#
# The reason to own the workflow is re-runnability. A default-setup run is GitHub-managed
# (`event: dynamic`, no workflow file in the repository), so `gh run rerun` is refused and
# an intermittent extractor failure can only be cleared by pushing a new commit — which a
# bot-authored release PR will never do, leaving it blocked indefinitely (#6767). A run of
# this workflow can simply be re-run.
#
# Go is extracted buildless (`build-mode: none`). The Go extractor resolves the module
# graph with `go list` and reads types from source, so it needs no compiler and covers
# every `go.mod` in the workspace — root, `desktop/` and `third_party/go-archive/` — in one
# job. A traced build instead compiles that graph alongside the extractor, and the two
# together exceed the runner.
#
# Same languages and suite as the default setup it replaces: actions, Go and
# JavaScript/TypeScript with the security-extended queries. This satisfies the "Require
# code scanning results" ruleset. Code-quality results cannot come from a custom workflow
# (the CodeQL Action rejects `analysis-kinds: code-quality` here), so the "Require code
# quality results" ruleset needs its own source once default setup is off.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "46 6 * * 6" # weekly

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, javascript-typescript]
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
