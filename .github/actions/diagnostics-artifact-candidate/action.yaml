# Generated by .github/scripts/diagnostics-artifact-fixture.sh; do not edit.
name: Native diagnostics artifact fixture
description: Exercise the production failure and artifact steps without a cluster
inputs:
  distribution:
    description: Kubernetes distribution (Vanilla, K3s, Talos, VCluster, KWOK)
    required: true
  provider:
    description: Infrastructure provider (Docker, Hetzner, Omni)
    required: false
    default: Docker
  args:
    description: Additional arguments for project init/create
    required: false
    default: ""
  calico-migration-binary:
    description: Verified producer binary that creates a legacy Calico cluster before candidate updates
    required: false
    default: ""
  calico-migration-sha256:
    description: SHA-256 from the immutable baseline binary producer
    required: false
    default: ""
  create-binary:
    description: Published KSail release binary that runs project init and cluster create only; every later step uses the build under test
    required: false
    default: ""
  create-binary-sha256:
    description: SHA-256 of create-binary, checked again before it runs
    required: false
    default: ""
  kubernetes-upgrade-from:
    description: Known starting Kubernetes version for the optional Docker/Talos upgrade trial
    required: false
    default: ""
  kubernetes-upgrade-to:
    description: Known target Kubernetes version for the optional Docker/Talos upgrade trial
    required: false
    default: ""
  init:
    description: Whether to run ksail project init before create
    required: false
    default: "false"
  ecr-public-upstream:
    description: Upstream for the ECR Public mirror and containerd fallback
    required: false
    default: https://ecr-public.aws.com
  test-workload-image:
    description: Image to use for workload create test
    required: false
    default: traefik/whoami:v1.10
  test-workload-name:
    description: Name for the test workload deployment
    required: false
    default: whoami
  apply-overlay-path:
    description: Path to kustomize overlay for workload apply test
    required: false
    default: ""
  gitops-path:
    description: Path for GitOps push (only if --gitops-engine in args)
    required: false
    default: k8s
  workload-timeout:
    description: |
      Timeout for workload wait operations. Set to 10 minutes to handle
      intermittent delays in CI environments (image pulls, resource contention).
    required: false
    default: 600s
  ghcr-user:
    description: GitHub Container Registry username (for external registry auth)
    required: false
    default: ""
  ghcr-token:
    description: GitHub Container Registry token (for external registry auth)
    required: false
    default: ""
  dockerhub-user:
    description: |
      Docker Hub username. Passed to the Kubernetes-provider phase so nested
      clusters pull through authenticated mirrors (avoiding upstream rate limits).
    required: false
    default: ""
  dockerhub-token:
    description: |
      Docker Hub token/password. Passed to the Kubernetes-provider phase so nested
      clusters pull through authenticated mirrors (avoiding upstream rate limits).
    required: false
    default: ""
  test-kubernetes-provider:
    description: |
      When 'true', runs an additional phase that tests the Kubernetes provider
      by creating nested clusters (all supported distributions) on top of the
      currently active host cluster. Set to 'true' only for one matrix entry
      per host type to avoid redundant testing.
    required: false
    default: "false"
  test-workload-mirror:
    description: |
      When 'true', smoke-tests workload mirror against a live HTTP deployment.
      Enable on one Docker matrix entry per supported distribution.
    required: false
    default: "false"
  kubernetes-provider-distributions:
    description: |
      Comma-separated list of distributions to test on the Kubernetes provider.
      Only used when test-kubernetes-provider is 'true'.
    required: false
    default: Vanilla,K3s,VCluster,Talos
  kubernetes-provider-cni:
    description: |
      Optional CNI to install in each nested Kubernetes-provider cluster (e.g.
      "Calico"). Only used when test-kubernetes-provider is 'true'.
    required: false
    default: ""
  assert-k3k-server-creator:
    description: |
      Assert the k3k server pod creating principal after each nested K3s create and
      record the evidence (see the ksail-test-kubernetes-provider action). Only used
      when test-kubernetes-provider is 'true'.
    required: false
    default: "false"
  rolling-resize-server-type:
    description: |
      Hetzner only. When set to a server type (e.g. "cx33"), runs an additional
      step that changes the control-plane and worker server types in ksail.yaml
      and applies them via `ksail cluster update --force`, exercising the rolling
      node replacement path. Only roles with enough redundancy actually roll
      (control planes require >= 3 nodes; workers require >= 1), so provision the
      cluster with --control-planes 3 and/or --workers 1 for the path to run.
      Leave empty to skip.
    required: false
    default: ""
  test-talos-schematic-rollout:
    description: |
      Hetzner Talos only. Change the Image Factory schematic without changing
      the Talos version, then verify the running image converges on the new
      schematic and the cluster is healthy. Intended for a manual dispatch.
    required: false
    default: "false"
  talos-schematic-server-type:
    description: Explicit Hetzner class for an initialized Talos schematic trial (cx23, cx33 or cpx22). Empty keeps defaults.
    required: false
    default: ""
  test-autoscaler-inventory:
    description: Run the optional Talos/Hetzner orphaned-server audit with one powered-off probe.
    required: false
    default: "false"
  inventory-trial-server-type:
    description: Initial server type shared by the cluster and powered-off inventory probe.
    default: cx23
  inventory-trial-location:
    description: Location shared by the cluster and powered-off inventory probe.
    default: fsn1
  floating-ip-toggle:
    description: |
      Hetzner + Talos only. When 'true', runs an additional step that enables
      floatingIPEnabled in ksail.yaml and applies it via `ksail cluster update
      --force`, asserts the ksail-owned floating IP exists and is the kubeconfig
      API endpoint, then disables it again and asserts the address is released
      and the API is reachable on the node address. Needs an explicit --name.
    required: false
    default: "false"
  upload-artifacts:
    description: |
      Upload diagnostics and logs from inside this composite action. Callers
      that need hard upload timeouts can disable these and upload the exposed
      paths from workflow-level steps instead.
    required: false
    default: "true"
  cleanup:
    description: |
      Delete the cluster inside this composite action. Workflow callers that
      must upload diagnostics before cleanup can disable this and invoke the
      dedicated cleanup action afterward.
    required: false
    default: "true"
  comprehensive-debug:
    description: |
      Run the comprehensive Kubernetes debug action after a failure. Disable
      for failure modes where the Kubernetes API itself may be wedged; the
      bounded core diagnostics still run.
    required: false
    default: "true"
outputs:
  trial-outcome:
    description: Native trial outcome
    value: ${{ steps.fixture-trial.outcome }}
  save-outcome:
    description: Native capture outcome
    value: ${{ steps.fixture-save.outcome }}
  upload-outcome:
    description: Native upload outcome
    value: ${{ steps.fixture-upload.outcome }}
runs:
  using: composite
  steps:
    - name: Identify isolated fixture artifact
      id: generate-tag
      shell: bash
      env:
        FIXTURE_MODE: candidate
      run: printf 'tag=fixture-%s-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$FIXTURE_MODE" >> "$GITHUB_OUTPUT"
    - name: Declare unused version input
      id: k8s-version-pin
      shell: bash
      run: printf 'flag=\n' >> "$GITHUB_OUTPUT"
    - name: "\U0001F9EA Hetzner autoscaler inventory — unchanged update and retry"
      if: inputs.test-autoscaler-inventory == 'true'
      shell: bash
      env:
        DISTRIBUTION: ${{ inputs.distribution }}
        PROVIDER: ${{ inputs.provider }}
        CLUSTER_NAME: st-hetzner-dispatch-${{ github.run_id }}
        TRIAL_SERVER_TYPE: ${{ inputs.inventory-trial-server-type }}
        TRIAL_LOCATION: ${{ inputs.inventory-trial-location }}
        K8S_VERSION_FLAG: ${{ steps.k8s-version-pin.outputs.flag }}
      run: |
        set -euo pipefail
        [[ "$DISTRIBUTION" == Talos && "$PROVIDER" == Hetzner && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
        export K8S_VERSION="${K8S_VERSION_FLAG#--kubernetes-version }"
        timeout --kill-after=6m 20m bash "$GITHUB_WORKSPACE/.github/actions/ksail-system-test/autoscaler-audit-trial.sh"
      id: fixture-trial
    - name: "\U0001F4CB Save system test diagnostics"
      if: failure()
      shell: bash
      env:
        DISTRIBUTION: ${{ inputs.distribution }}
      run: |
        mkdir -p /tmp/system-test-diagnostics
        {
          echo "=== System Test Failure Diagnostics ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== Docker Containers ==="
          timeout --kill-after=10s 30s docker ps -a 2>&1 || true
          echo ""
          echo "=== Cluster Info ==="
          timeout --kill-after=10s 1m ksail cluster info 2>&1 || true
          echo ""
          echo "=== Pod Status (all namespaces) ==="
          timeout --kill-after=10s 1m ksail workload get pods -A 2>&1 || true
          echo ""
          echo "=== Recent Events ==="
          timeout --kill-after=10s 1m \
            ksail workload get events -A --sort-by=.lastTimestamp 2>&1 || true
          echo ""
          echo "=== Node Status ==="
          timeout --kill-after=10s 1m ksail workload get nodes -o wide 2>&1 || true
          if [ "$DISTRIBUTION" = "VCluster" ]; then
            echo ""
            echo "=== VCluster ECR mirror routing ==="
            node=$(docker ps --format '{{.Names}}' --filter 'name=vcluster.cp.' | head -n 1 || true)
            if [ -n "$node" ]; then
              if timeout --kill-after=5s 15s docker exec "$node" \
                test -f /etc/containerd/certs.d/ecr-public.aws.com/hosts.toml; then
                echo "ecr_hosts_toml=present"
              else
                echo "ecr_hosts_toml=absent-or-unreadable"
              fi
              timeout --kill-after=5s 15s docker exec "$node" \
                containerd config dump 2>/dev/null \
                | awk '/^[[:space:]]*config_path[[:space:]]*=/ { print "containerd_" $0; found=1 } END { if (!found) print "containerd_config_path=not-reported" }' \
                || true
              cri_path=$(timeout --kill-after=5s 15s docker exec "$node" \
                crictl info -o json 2>/dev/null \
                | jq -r '.config.registry.configPath // .config.registry.config_path // empty' \
                | head -n 1 || true)
              echo "cri_registry_config_path=${cri_path:-not-reported}"
            else
              echo "vcluster_control_plane=unavailable"
            fi
            mirror=$(docker ps --format '{{.Names}}' \
              | grep -E '^vcluster-.*-ecr-public\.aws\.com$' | head -n 1 || true)
            if [ -n "$mirror" ]; then
              timeout --kill-after=5s 15s docker logs "$mirror" 2>&1 \
                | awk '/GET/ { total++ } /GET/ && /redis/ { requests++; if (/429/) limited++ } END { printf "mirror_log_gets=%d redis_mirror_log_gets=%d redis_mirror_log_429=%d\n", total, requests, limited }' \
                || true
            else
              echo "ecr_mirror_container=unavailable"
            fi
          fi
        } > /tmp/system-test-diagnostics/diagnostics.log 2>&1
      id: fixture-save
    - name: "\U0001F4E4 Upload system test diagnostics"
      if: failure() && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: system-test-diagnostics-${{ steps.generate-tag.outputs.tag }}
        path: /tmp/system-test-diagnostics/
        retention-days: 7
        if-no-files-found: ignore
      id: fixture-upload
